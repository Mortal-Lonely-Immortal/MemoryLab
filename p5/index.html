<!DOCTYPE html>
<html lang="zh-CN" data-theme="black">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>记忆实验室 · P5</title>
<meta name="description" content="AI 学习辅助系统">
<meta name="theme-color" content="#0d1718">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><polygon points='16,2 30,30 2,30' fill='%233f9d95'/></svg>">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("memoryLabTheme")||"black"}catch(e){}</script>
<style>
/* ================================================================
   Persona 5 战斗状态画面 — 设计系统
   ================================================================ */
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg: #0d1718;
  --surface: #132021;
  --card: #162627;
  --panel-deep: #0f1b1c;
  --panel-soft: #112021;
  --border: #2b4141;
  --border-strong: #3a5252;
  --text: #e7f1ee;
  --text-dim: #9db2ac;
  --text-muted: #6f8782;
  --accent: #3f9d95;
  --accent-dim: #2f7f78;
  --red: #c46a6a;
  --red-bright: #de8a8a;
  --blue: #7fb7d3;
  --cyan: #6fc7c0;
  --green: #8fbf7f;
  --pale: #cfeaf6;
  --magenta: #f0417f;
  --dark-pattern: #2b4141;
  --hp-green: #7fbf9f;
  --font-display: 'Arial Black','Impact','Helvetica Neue',sans-serif;
  --font-body: 'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;
  --font-mono: 'Courier New',monospace;
}

/* P3 white/daylight channel — additive, black stays default */
html[data-theme="white"] {
  --bg: #eef5f9;
  --surface: #f8fcff;
  --card: #ffffff;
  --panel-deep: #e8f4fb;
  --panel-soft: #f2f9fd;
  --border: #b9d6e7;
  --border-strong: #8fb8d0;
  --text: #0a1230;
  --text-dim: #3d4a66;
  --text-muted: #6b7f99;
  --accent: #1b57ff;
  --accent-dim: #0a3bd6;
  --red: #f0417f;
  --red-bright: #ff6b9e;
  --blue: #35d1e8;
  --cyan: #35d1e8;
  --green: #2c9a7a;
  --pale: #cfeaf6;
  --magenta: #f0417f;
  --dark-pattern: #dcecf5;
}

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* 背景暗纹层 */
.bg-pattern {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(255,255,255,0.012) 3px, rgba(255,255,255,0.012) 6px),
    repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(63,157,149,0.015) 40px, rgba(63,157,149,0.015) 41px);
}

/* ================================================================
   顶部导航
   ================================================================ */
.p5-nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 30;
  display: flex; align-items: center; gap: 0;
  padding: 8px 16px;
  background: linear-gradient(180deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.85) 80%, transparent 100%);
}
.p5-nav .logo {
  font-family: var(--font-display); font-size: 18px; font-weight: 900;
  color: var(--accent); letter-spacing: 3px;
  margin-right: 20px;
  transform: skewX(-8deg);
  text-shadow: 2px 2px 0 #000, 0 0 20px rgba(63,157,149,0.3);
}
.p5-nav .logo span { color: #fff; font-size: 11px; letter-spacing: 1px; margin-left: 4px; }
.nav-tab {
  padding: 8px 16px; cursor: pointer;
  font-family: var(--font-display); font-size: 11px; font-weight: 900;
  letter-spacing: 2px; color: var(--text-muted);
  text-transform: uppercase;
  background: var(--panel-deep, #0f1b1c);
  border: 2px solid var(--border, #2b4141);
  clip-path: polygon(8px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
  transform: skewX(-6deg);
  transition: all .12s ease;
  margin-right: -2px;
}
.nav-tab > * { transform: skewX(6deg); display: inline-block; }
.nav-tab:hover { color: #fff; border-color: var(--border-strong, #3a5252); background: #111; }
.nav-tab.active {
  color: #fff; background: var(--accent); border-color: var(--accent);
  z-index: 2;
  box-shadow: 0 0 16px rgba(63,157,149,0.25);
}
.nav-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.nav-ver {
  margin-left: auto; font-family: var(--font-mono); font-size: 10px;
  color: var(--border-strong, #3a5252); letter-spacing: 1px;
}
.nav-ver b { color: var(--accent); }

/* 移动端 */
@media (max-width: 768px) {
  .p5-nav { flex-wrap: wrap; padding: 6px 10px; }
  .nav-tab { font-size: 10px; padding: 6px 10px; margin: 2px 0; }
  .p5-nav .logo { font-size: 14px; margin-right: auto; }
  .nav-ver { display: none; }
}

/* ================================================================
   主内容区
   ================================================================ */
.main {
  position: relative; z-index: 1;
  padding: 64px 20px 40px;
  max-width: 1400px; margin: 0 auto;
}

/* ================================================================
   通用卡片
   ================================================================ */
.p5-card {
  background: var(--card);
  border: 2px solid var(--border, #2b4141);
  padding: 20px;
  position: relative;
  clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 16px) 100%, 0 100%, 0 8px);
}
.p5-card::after {
  content: ''; position: absolute; top: -2px; left: 28px;
  width: 36px; height: 3px; background: var(--accent);
}
.p5-card:hover { border-color: var(--border-strong, #3a5252); }
.p5-card-header {
  font-family: var(--font-display); font-size: 13px; font-weight: 900;
  letter-spacing: 2px; color: var(--accent);
  text-transform: uppercase; margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px;
}

/* ================================================================
   按钮
   ================================================================ */
.btn {
  padding: 10px 22px;
  background: var(--panel-deep, #0f1b1c); border: 2px solid var(--border-strong, #3a5252);
  color: #ccc; cursor: pointer;
  font-family: var(--font-body); font-size: 12px; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase;
  clip-path: polygon(6px 0, 100% 0, calc(100% - 4px) 100%, 0 100%);
  transition: all .12s ease;
  transform: skewX(-4deg);
}
.btn > * { transform: skewX(4deg); display: inline-block; }
.btn:hover { border-color: var(--accent); color: #fff; background: #111; }
.btn:active { transform: skewX(-4deg) scale(0.96); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-primary {
  background: var(--accent); border-color: var(--accent); color: #fff;
  font-weight: 900;
}
.btn-primary:hover {
  background: #ff1a1a; border-color: #ff1a1a;
  box-shadow: 0 0 20px rgba(63,157,149,0.3);
}
.btn-success { border-color: #4a9; color: #4a9; }
.btn-success:hover { background: #4a9; color: #000; border-color: #4a9; }
.btn-danger { border-color: #444; color: #777; }
.btn-danger:hover { border-color: var(--red); color: var(--red); background: rgba(192,0,0,0.1); }
.btn-warning { background: var(--red); border-color: var(--red); color: #fff; }
.btn-warning:hover { background: var(--red-bright); }
.btn-sm { padding: 5px 12px; font-size: 10px; clip-path: polygon(4px 0, 100% 0, calc(100% - 2px) 100%, 0 100%); }

/* ================================================================
   输入框
   ================================================================ */
input, select, textarea {
  background: #080808; border: 2px solid var(--border, #2b4141);
  padding: 10px 14px; color: #fff;
  font-family: var(--font-body); font-size: 13px;
  width: 100%; outline: none;
  transition: border-color .12s;
  clip-path: polygon(4px 0, 100% 0, calc(100% - 3px) 100%, 0 100%);
}
input:focus, select:focus, textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(63,157,149,0.12);
}
input[type="checkbox"], input[type="radio"] { width: auto; accent-color: var(--accent); }
input[type="range"] { accent-color: var(--accent); }
textarea { resize: vertical; min-height: 80px; }

/* ================================================================
   Toast
   ================================================================ */
.toast {
  position: fixed; top: 20px; right: 20px; z-index: 60;
  padding: 12px 20px; font-size: 13px; font-weight: 700;
  letter-spacing: 1px; pointer-events: none;
  opacity: 0; transform: translateY(-12px);
  transition: opacity .3s, transform .3s;
  max-width: 380px; color: #fff;
  background: var(--panel-deep, #0f1b1c); border: 2px solid var(--accent);
  clip-path: polygon(8px 0, 100% 0, calc(100% - 4px) 100%, 0 100%);
}
.toast.show { opacity: 1; transform: translateY(0); }

/* ================================================================
   进度条
   ================================================================ */
.progress-bar {
  height: 6px; background: #111;
  clip-path: polygon(2px 0, 100% 0, calc(100% - 2px) 100%, 0 100%);
  overflow: hidden; margin: 8px 0;
}
.progress-fill { height: 100%; transition: width .5s cubic-bezier(0.4,0,0.2,1); }
.progress-fill.xp { background: var(--accent); }
.progress-fill.hp { background: var(--hp-green); }

/* ================================================================
   聊天区
   ================================================================ */
.chat-container {
  height: 400px; overflow-y: auto; background: var(--surface, #102021);
  padding: 16px; margin-bottom: 14px;
  display: flex; flex-direction: column; gap: 10px;
  scroll-behavior: smooth;
  border: 1px solid var(--border, #2b4141);
}
.chat-msg {
  max-width: 80%; padding: 11px 16px;
  font-size: 14px; line-height: 1.65;
  white-space: pre-wrap; word-break: break-word;
  animation: msgIn .2s ease;
  clip-path: polygon(6px 0, 100% 0, calc(100% - 4px) 100%, 0 100%);
}
@keyframes msgIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
.chat-msg.user {
  align-self: flex-end; background: var(--accent); color: #000;
  font-weight: 700;
}
.chat-msg.assistant {
  align-self: flex-start; background: #111; border: 2px solid var(--border, #2b4141); color: #ddd;
}
.skeleton-msg {
  align-self: flex-start; display: flex; flex-direction: column; gap: 8px;
  padding: 12px 16px; background: #111; width: 55%;
  clip-path: polygon(6px 0, 100% 0, calc(100% - 4px) 100%, 0 100%);
}
.skeleton-line {
  height: 12px;
  background: linear-gradient(90deg, var(--border, #2b4141) 25%, rgba(63,157,149,0.08) 50%, var(--border, #2b4141) 75%);
  background-size: 200% 100%; animation: shimmer 1.5s infinite;
}
.skeleton-line:last-child { width: 55%; }
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
.chat-input-row { display: flex; gap: 10px; }
.tutor-skill-badge {
  display: inline-flex; align-items: center; margin-left: 8px; padding: 3px 6px;
  border: 1px solid var(--accent); color: var(--accent);
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 1px;
}
.chat-input-row input { flex: 1; }

/* ================================================================
   技能卡片
   ================================================================ */
.skill-card {
  display:flex; align-items:center; gap:14px;
  padding:14px; background: var(--panel-deep, #0f1b1c); border: 2px solid var(--border, #2b4141);
  margin-bottom: 6px;
  clip-path: polygon(8px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
  transition: border-color .12s;
}
.skill-card:hover { border-color: var(--border-strong, #3a5252); }
.skill-icon {
  width:44px; height:44px; display:flex;
  align-items:center; justify-content:center;
  font-family:var(--font-display); font-size:16px; font-weight:900;
  color:var(--accent); flex-shrink:0;
  border:2px solid var(--border, #2b4141); background:#000;
  clip-path: polygon(4px 0, 100% 0, calc(100% - 3px) 100%, 0 100%);
}
.skill-info { flex:1; min-width:0; }
.skill-info .name { font-weight:700; font-size:13px; letter-spacing:0.5px; }
.skill-info .rank-tag {
  font-size:10px; padding:2px 8px; display:inline-block; margin-top:4px;
  font-weight:700; letter-spacing:1px; text-transform:uppercase;
  background: rgba(63,157,149,0.12); color: var(--accent);
  clip-path: polygon(3px 0, 100% 0, calc(100% - 2px) 100%, 0 100%);
}

/* 五段式等级条 */
.rank-bar { display:flex; gap:2px; align-items:center; font-size:10px; margin-bottom:8px; }
.rank-segment {
  flex:1; text-align:center; padding:4px 2px;
  font-weight:700; letter-spacing:0.5px; font-family:var(--font-body);
  clip-path: polygon(3px 0, 100% 0, calc(100% - 2px) 100%, 0 100%);
}
.rank-segment.done { background: var(--border-strong, #3a5252); color:#fff; }
.rank-segment.current { background: var(--accent); color:#000; font-weight:900; }
.rank-segment.future { background: var(--panel-deep, #0f1b1c); color:#444; }

/* ================================================================
   属性卡片
   ================================================================ */
.stats-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;
}
.stat-card {
  background:var(--panel-deep, #0f1b1c); border:2px solid var(--border, #2b4141);
  padding:16px; text-align:center;
  clip-path: polygon(8px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
  position:relative;
}
.stat-card::before {
  content:''; position:absolute; top:0; left:14px;
  width:20px; height:2px; background:var(--accent);
}
.stat-card .value {
  font-family:var(--font-display); font-size:32px; font-weight:900;
  color:var(--accent); letter-spacing:1px;
}
.stat-card .label {
  font-size:10px; color:var(--text-dim); margin-top:4px;
  letter-spacing:1px; text-transform:uppercase; font-weight:700;
}

/* ================================================================
   P5 角色信息卡片 — 左上角双层斜切标签
   ================================================================ */
.char-info-card {
  position: relative; display: inline-block;
  transform: rotate(-2deg);
}
.char-info-card .tag-top {
  background: #fff; color: #000;
  border: 3px solid #000;
  padding: 8px 20px;
  font-family: var(--font-display); font-size: 14px; font-weight: 900;
  letter-spacing: 1px;
  display: flex; align-items: center; gap: 12px;
  clip-path: polygon(10px 0, 100% 0, calc(100% - 8px) 100%, 0 100%, 0 6px);
  transform: rotate(2deg);
  position: relative; z-index: 2;
}
.char-info-card .tag-top .icon-l { color: var(--red); font-size: 16px; }
.char-info-card .tag-top .icon-r {
  background: #000; color: #fff; padding: 2px 6px;
  font-size: 10px; font-family: var(--font-display);
  clip-path: polygon(2px 0, 100% 0, calc(100% - 2px) 100%, 0 100%);
}
.char-info-card .tag-bottom {
  background: var(--accent); color: #000;
  border: 3px solid #000;
  padding: 8px 24px;
  font-family: var(--font-display); font-size: 22px; font-weight: 900;
  letter-spacing: 2px;
  clip-path: polygon(12px 0, 100% 0, calc(100% - 10px) 100%, 0 100%, 0 4px);
  transform: rotate(1deg);
  position: relative; z-index: 1;
  margin-top: -4px; margin-left: 12px;
  display: flex; align-items: baseline; gap: 16px;
}
.char-info-card .tag-bottom .next-exp {
  font-size: 10px; letter-spacing: 1px; opacity: 0.7;
}
.char-info-card .hp-row {
  margin-top: 6px; padding-left: 24px;
  font-family: var(--font-display); font-size: 13px; font-weight: 700;
  color: #aaa; letter-spacing: 1px;
  transform: rotate(1deg);
}
.char-info-card .red-bar {
  position: absolute; left: -12px; top: -4px; bottom: -4px;
  width: 6px; background: var(--red);
  clip-path: polygon(0 2px, 100% 0, 100% 100%, 0 calc(100% - 2px));
}

/* ================================================================
   战斗属性标签
   ================================================================ */
.stat-tags {
  display: flex; flex-direction: column; gap: 8px;
}
.stat-tag {
  background: var(--dark-pattern);
  border: 2px solid var(--border-strong, #3a5252);
  padding: 10px 16px;
  display: flex; align-items: center; gap: 12px;
  font-family: var(--font-display); font-size: 11px; font-weight: 900;
  letter-spacing: 2px; color: #ccc;
  clip-path: polygon(8px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
  transform: skewX(-3deg);
  min-width: 140px;
}
.stat-tag > * { transform: skewX(3deg); }
.stat-tag .st-val {
  margin-left: auto; color: var(--accent);
  font-size: 15px; font-family: var(--font-display);
}

/* ================================================================
   P5 五角星面板
   ================================================================ */

/* P5 UI 扩展模块 */
.p5-char-card {
  position: absolute; top: 3%; left: 3%; z-index: 7;
  background: #fff; color: #000;
  border: 2px solid #000;
  padding: 7px 15px 5px; min-width: 110px;
  clip-path: polygon(8px 0, 100% 0, calc(100% - 5px) 100%, 0 100%);
  transform: skewX(-6deg);
}
.p5-char-card .cc-row { display: flex; justify-content: space-between; align-items: baseline; }
.p5-char-card .cc-name { font-family: 'Arial Black','Impact',sans-serif; font-size: 17px; font-weight: 900; letter-spacing: 2px; }
.p5-char-card .cc-lv { font-size: 9px; font-weight: 700; letter-spacing: 1px; color: #555; }
.p5-char-card .cc-exp { font-size: 8px; letter-spacing: 1px; color: #888; margin-top: 1px; }
.p5-char-card .cc-keys { font-size: 8px; color: #aaa; letter-spacing: 1px; text-align: right; }
.p5-date-tag {
  position: absolute; top: 3%; left: 3%; margin-top: 62px; z-index: 7;
  background: #fff; color: #000;
  border: 2px solid #000;
  padding: 3px 10px;
  clip-path: polygon(4px 0, 100% 0, calc(100% - 3px) 100%, 0 100%);
  transform: skewX(-6deg);
  font-family: 'Arial Black','Impact',sans-serif; font-size: 13px; font-weight: 900; letter-spacing: 2px;
}
.p5-battle-box {
  position: absolute; left: 2%; top: 50%; transform: translateY(-50%) skewX(-6deg);
  z-index: 7; color: #fff;
  font-family: 'Microsoft YaHei','PingFang SC',sans-serif; font-size: 11px;
}
.p5-battle-box .bt-persona {
  font-family: 'Arial Black','Impact',sans-serif; font-size: 15px; font-weight: 900;
  letter-spacing: 2px; margin-bottom: 10px; color: var(--accent);
}
.p5-battle-box .bt-row { margin: 4px 0; letter-spacing: 2px; display: flex; justify-content: space-between; width: 90px; }
.p5-battle-box .bt-val { color: var(--accent); font-weight: 700; }
.p5-exit-hint {
  position: absolute; bottom: 12%; right: 4%;
  color: #bbb; font-family: 'Microsoft YaHei','PingFang SC',sans-serif; font-size: 12px;
  letter-spacing: 2px; z-index: 7;
  clip-path: polygon(5px 0, 100% 0, calc(100% - 3px) 100%, 0 100%);
  background: var(--border, #2b4141); border: 2px solid #444;
  padding: 5px 12px; transform: skewX(-6deg);
}
.p5-speech-bubble {
  position: absolute; top: 7%; right: 5%; z-index: 7;
  background: #fff; color: #000;
  border: 3px solid #000;
  padding: 10px 20px 6px;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), 30px calc(100% - 10px), 20px 100%, 10px calc(100% - 10px), 0 calc(100% - 10px));
  transform: rotate(2deg);
}
.p5-speech-bubble .sb-status {
  font-family: 'Arial Black','Impact',sans-serif; font-size: 22px; font-weight: 900;
  letter-spacing: 3px; line-height: 1;
}
.p5-speech-bubble .sb-sub {
  font-size: 8px; letter-spacing: 2px; color: #666; text-transform: uppercase;
}
.p5-speech-bubble .sb-grade {
  position: absolute; top: -12px; right: -10px;
  background: #c46a6a; color: #fff;
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Arial Black','Impact',sans-serif; font-size: 14px; font-weight: 900;
  border: 2px solid #000;
  clip-path: polygon(4px 0, 100% 0, calc(100% - 3px) 100%, 0 100%);
  transform: rotate(-3deg);
}

.pentagram-panel {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  max-width: 620px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
}
.pentagram-panel svg {
  width: 100%; height: 100%;
  display: block;
}

/* ================================================================
   五角星顶点属性标签 — 黄底黑字倾斜方块
   ================================================================ */
.vertex-label {
  position: absolute; z-index: 5;
  transform: translate(-50%, -50%) skewX(-8deg);
  transition: opacity .35s ease;
  pointer-events: none;
}
.vertex-label .vl-tag {
  background: #ffcc00; color: #000;
  border: 2px solid #000;
  padding: 4px 10px;
  font-family: var(--font-display); font-size: 16px; font-weight: 900;
  letter-spacing: 2px;
  white-space: nowrap;
  clip-path: polygon(6px 0, 100% 0, calc(100% - 4px) 100%, 0 100%);
  text-align: center;
}
.vertex-label .vl-level {
  display: inline-block;
  background: #000; color: #ffcc00;
  font-family: var(--font-display); font-size: 13px;
  padding: 1px 6px; margin-left: 4px;
  clip-path: polygon(2px 0, 100% 0, calc(100% - 2px) 100%, 0 100%);
}
.vertex-label .vl-level.max {
  background: #c46a6a; color: #fff;
  animation: maxPulse 1.2s infinite;
}
@keyframes maxPulse {
  0%,100% { box-shadow: 0 0 4px rgba(192,0,0,0.4); }
  50% { box-shadow: 0 0 12px rgba(255,0,0,0.7); }
}
.vertex-label .vl-sub {
  font-size: 10px; color: #aaa;
  letter-spacing: 1px;
  text-align: center;
  margin-top: 2px;
}

/* ================================================================
   对话气泡状态标签 — 右上角
   ================================================================ */
.speech-bubble {
  position: relative;
  background: #fff; color: #000;
  border: 3px solid #000;
  padding: 12px 20px 8px;
  display: inline-block;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), 28px calc(100% - 8px), 18px 100%, 8px calc(100% - 8px), 0 calc(100% - 8px));
  transform: rotate(2deg);
}
.speech-bubble .sb-status {
  font-family: var(--font-display); font-size: 22px; font-weight: 900;
  letter-spacing: 3px; line-height: 1;
}
.speech-bubble .sb-sub {
  font-size: 8px; letter-spacing: 2px;
  color: var(--text-muted);
  text-transform: uppercase;
}
.speech-bubble .sb-grade {
  position: absolute; top: -10px; right: -8px;
  background: var(--red); color: #fff;
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-size: 14px; font-weight: 900;
  clip-path: polygon(3px 0, 100% 0, calc(100% - 2px) 100%, 0 100%);
  transform: rotate(-2deg);
}

/* ================================================================
   向导
   ================================================================ */
.wizard-steps { display:flex; gap:4px; margin-bottom:20px; }
.wizard-step {
  flex:1; text-align:center; padding:10px 6px;
  font-size:11px; font-weight:700; letter-spacing:1px;
  text-transform:uppercase;
  background:var(--panel-deep, #0f1b1c); color:var(--text-dim); border:2px solid var(--border, #2b4141);
  clip-path: polygon(6px 0, 100% 0, calc(100% - 4px) 100%, 0 100%);
}
.wizard-step.active { background:var(--accent); color:#000; border-color:var(--accent); font-weight:900; }
.wizard-step.done { background:var(--border, #2b4141); color:#fff; }

/* 文档查看器 */
.doc-viewer {
  background:#fafafa; color:var(--border, #2b4141); padding:30px;
  max-height:600px; overflow-y:auto; line-height:1.8; font-size:15px;
  border:2px solid #ddd;
}
.doc-viewer img { max-width:100%; margin:16px 0; }
.doc-viewer .chapter-title {
  font-family:var(--font-display); font-size:20px; font-weight:900;
  margin:24px 0 16px; border-bottom:3px solid var(--accent); padding-bottom:8px;
  letter-spacing:1px;
}

/* 表格 */
table { width:100%; border-collapse:collapse; }
th,td { padding:10px 14px; text-align:left; font-size:12px; border-bottom:2px solid var(--border, #2b4141); }
th { color:var(--accent); font-weight:900; font-size:10px; letter-spacing:2px; text-transform:uppercase; }
tr:hover td { background:rgba(63,157,149,0.03); }

/* 番茄钟 */
.pomodoro-circle {
  width:160px; height:160px;
  border:3px solid var(--accent); background:#000;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  margin:20px auto; cursor:pointer; user-select:none;
  clip-path: polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  transition: border-color .3s, box-shadow .3s;
}
.pomodoro-circle.running {
  border-color: #ff1a1a;
  box-shadow: 0 0 30px rgba(63,157,149,0.25);
  animation: p5Pulse 2s infinite;
}
@keyframes p5Pulse {
  0%,100% { box-shadow: 0 0 20px rgba(63,157,149,0.2); }
  50% { box-shadow: 0 0 50px rgba(63,157,149,0.4); }
}
.pomodoro-time {
  font-family: var(--font-display); font-size: 48px; font-weight: 900;
  color: #fff; letter-spacing: 2px;
}
.pomodoro-label { font-size:10px; color:var(--text-dim); letter-spacing:2px; text-transform:uppercase; font-weight:700; }
.pomodoro-controls { display:flex; align-items:center; justify-content:center; gap:10px; margin-top:16px; flex-wrap:wrap; }
.pomodoro-slider { width:150px !important; accent-color:var(--accent); }
.multiplier-btn {
  padding:6px 14px; border:2px solid var(--border, #2b4141); background:var(--panel-deep, #0f1b1c);
  color:var(--text-dim); cursor:pointer; font-size:13px; font-weight:700;
  letter-spacing:1px; transition:.12s;
  clip-path: polygon(3px 0, 100% 0, calc(100% - 2px) 100%, 0 100%);
}
.multiplier-btn:hover { border-color:var(--accent); color:#fff; }
.multiplier-btn.active { border-color:var(--accent); background:rgba(63,157,149,0.1); color:var(--accent); }
.pomodoro-duration-display { font-size:11px; color:var(--text-dim); margin-top:6px; letter-spacing:1px; }
.pomodoro-duration-display span { color:var(--accent); font-weight:700; }

/* 复习项 */
.review-item {
  display:flex; align-items:center; gap:12px;
  padding:12px; background:var(--panel-deep, #0f1b1c); margin-bottom:4px;
  border:1px solid var(--border, #2b4141);
  clip-path: polygon(6px 0, 100% 0, calc(100% - 4px) 100%, 0 100%);
}
.review-item .stage {
  padding:4px 10px; font-size:10px; font-weight:700; letter-spacing:1px;
  background:var(--accent); color:#000;
  clip-path: polygon(2px 0, 100% 0, calc(100% - 2px) 100%, 0 100%);
}
.review-item.overdue { border-left:3px solid var(--red); }

/* 空态/错误态 */
.empty-state { text-align:center; padding:48px 20px; color:var(--text-dim); }
.empty-state .empty-icon {
  font-size:48px; font-weight:900; color:var(--border, #2b4141); margin-bottom:12px;
  font-family:var(--font-display);
}
.empty-state h3 { color:#fff; margin-bottom:6px; font-family:var(--font-display); letter-spacing:1px; }
.empty-state p { font-size:12px; max-width:320px; margin:0 auto; letter-spacing:0.5px; }
.error-state {
  text-align:center; padding:32px 20px;
  background:rgba(192,0,0,0.05); border:2px solid rgba(192,0,0,0.2);
  color:var(--red); font-weight:700;
  clip-path: polygon(6px 0, 100% 0, calc(100% - 4px) 100%, 0 100%);
}
.setup-banner {
  background: rgba(63,157,149,0.04); border:2px solid rgba(63,157,149,0.15);
  padding:16px 20px; display:flex; align-items:center; gap:12px; margin-bottom:20px;
  clip-path: polygon(6px 0, 100% 0, calc(100% - 4px) 100%, 0 100%);
}
.setup-banner .msg { flex:1; font-size:13px; }
.setup-banner .msg strong { color:var(--accent); }

/* 弹窗 */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:40; }
.p5-modal {
  display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:41;
  max-height:70vh; overflow-y:auto; width:90%; max-width:500px;
  background:var(--surface); border:2px solid var(--accent);
  clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
}

/* ================================================================
   P5 时间天气看板 — 3.2:1 超宽纯黑画布，左半区紧凑元素集群
   ================================================================ */
.p5-time-card {
  position: relative;
  width: 100%;
  max-width: 900px;
  height: 240px;
  margin: 0 auto 16px;
  background: linear-gradient(135deg, #173335 0%, var(--surface, #102021) 62%, #1b3a3a 100%);
  border: 1px solid var(--border, #2b4141);
  overflow: visible;
  z-index: 8;
}

/* ---------- 主数字：2位日期，70%画布高度 ---------- */
.ptc-number {
  position: absolute;
  left: 2%;
  top: 8%;
  font-family: 'Arial Black','Impact','Bebas Neue',sans-serif;
  font-size: 156px;
  font-weight: 900;
  line-height: 0.85;
  color: #fff;
  letter-spacing: -0.08em;
  z-index: 4;
  transform: skewX(-12deg);
  text-shadow:
    8px 0 0 #000, -8px 0 0 #000,
    0 8px 0 #000, 0 -8px 0 #000,
    8px 8px 0 #000, -8px -8px 0 #000,
    8px -8px 0 #000, -8px 8px 0 #000,
    13px 0 0 #fff, -13px 0 0 #fff,
    0 13px 0 #fff, 0 -13px 0 #fff,
    13px 13px 0 #fff, -13px -13px 0 #fff,
    13px -13px 0 #fff, -13px 13px 0 #fff;
  user-select: none; pointer-events: none;
}

/* ---------- 英文星期行（左段 + 菱形 + 右段）---------- */
.ptc-week-row {
  position: absolute;
  left: 2%;
  top: 68%;
  z-index: 3;
  display: flex;
  align-items: center;
  white-space: nowrap;
}
.ptc-week-l, .ptc-week-r {
  display: inline-block;
  font-family: 'Arial Black','Impact',sans-serif;
  font-size: 36px;
  font-weight: 700;
  letter-spacing: -0.03em;
  color: #fff;
  line-height: 1;
  transform: skewX(-12deg);
  text-shadow:
    3px 0 0 #000, -3px 0 0 #000,
    0 3px 0 #000, 0 -3px 0 #000,
    3px 3px 0 #000, -3px -3px 0 #000,
    3px -3px 0 #000, -3px 3px 0 #000,
    6px 0 0 #fff, -6px 0 0 #fff,
    0 6px 0 #fff, 0 -6px 0 #fff,
    6px 6px 0 #fff, -6px -6px 0 #fff,
    6px -6px 0 #fff, -6px 3px 0 #fff;
}
.ptc-week-l { margin-right: 1px; }
.ptc-week-r { margin-left: 1px; }

/* 菱形框 */
.ptc-diamond {
  width: 48px; height: 48px;
  background: #fff;
  border: 3px solid #000;
  transform: skewX(-12deg) rotate(45deg);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  z-index: 4;
}
.ptc-diamond span {
  display: inline-block;
  transform: rotate(-45deg);
  font-family: 'Arial Black','Microsoft YaHei',sans-serif;
  font-size: 22px; font-weight: 900; color: #000;
  line-height: 1;
}

/* ---------- 底部黑条底座 ---------- */
.ptc-base {
  position: absolute;
  left: 2%;
  top: 78%;
  height: 10px;
  background: #000;
  min-width: 240px;
  z-index: 2;
  transform: skewX(-12deg);
  clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
}

/* ---------- 中文时段文字 ---------- */
.ptc-period {
  position: absolute;
  left: 2%;
  top: 80%;
  font-family: 'Arial Black','Microsoft YaHei','PingFang SC',sans-serif;
  font-size: 42px;
  font-weight: 900;
  letter-spacing: 0.06em;
  color: #fff;
  z-index: 3;
  transform: skewX(-12deg);
  text-shadow:
    4px 0 0 #000, -4px 0 0 #000,
    0 4px 0 #000, 0 -4px 0 #000,
    4px 4px 0 #000, -4px -4px 0 #000,
    4px -4px 0 #000, -4px 8px 0 #000;
  user-select: none; pointer-events: none;
}

/* ---------- 天气图标：紧贴主数字右上角 ---------- */
.ptc-weather {
  position: absolute;
  left: 30%;
  top: 6%;
  width: 88px;
  height: 88px;
  z-index: 5;
  transform: skewX(-12deg);
}
.ptc-weather svg { width: 100%; height: 100%; }

/* ---------- 入场动画 ---------- */
@keyframes ptc-num-in {
  0%   { transform: skewX(-12deg) translateX(-110%); opacity: 0; }
  55%  { transform: skewX(-12deg) translateX(3%); opacity: 1; }
  75%  { transform: skewX(-12deg) translateX(-1.5%); }
  100% { transform: skewX(-12deg) translateX(0); opacity: 1; }
}
@keyframes ptc-wx-in {
  0%   { transform: skewX(-12deg) translateX(40px) scale(0.5); opacity: 0; }
  100% { transform: skewX(-12deg) translateX(0) scale(1); opacity: 1; }
}
@keyframes ptc-per-in {
  0%   { transform: skewX(-12deg) translateX(-50px); opacity: 0; }
  100% { transform: skewX(-12deg) translateX(0); opacity: 1; }
}
@keyframes ptc-float {
  0%,100% { transform: skewX(-12deg) translateY(0); }
  50%    { transform: skewX(-12deg) translateY(-4px); }
}
.ptc-number.anim { animation: ptc-num-in 0.65s cubic-bezier(0.16,1,0.3,1) forwards; }
.ptc-weather.anim { animation: ptc-wx-in 0.5s 0.12s cubic-bezier(0.16,1,0.3,1) forwards, ptc-float 3.5s 0.7s ease-in-out infinite; }
.ptc-period.anim { animation: ptc-per-in 0.45s 0.22s cubic-bezier(0.16,1,0.3,1) forwards; }

/* ================================================================
   响应式
   ================================================================ */
@media (max-width:768px) {
  .main { padding: 56px 10px 20px; }
  .stats-grid { grid-template-columns:repeat(2,1fr); }
  .chat-msg { max-width: 90%; }
  .pentagram-panel { max-width: 340px; }
  .vertex-label .vl-tag { font-size: 12px; padding: 3px 7px; }
  .p5-char-card { min-width: 90px; padding: 5px 10px; }
  .p5-char-card .cc-name { font-size: 13px; }
  .p5-speech-bubble { padding: 6px 12px 4px; }
  .p5-speech-bubble .sb-status { font-size: 16px; }
  .p5-battle-box .bt-persona { font-size: 12px; }
  .p5-time-card { height: 180px; }
  .ptc-number { font-size: 110px; }
  .ptc-week-l, .ptc-week-r { font-size: 22px; }
  .ptc-diamond { width: 32px; height: 32px; }
  .ptc-diamond span { font-size: 16px; }
  .ptc-period { font-size: 26px; }
  .ptc-weather { width: 56px; height: 56px; left: 28%; }
  /* 注册遮罩 */
  .reg-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.92);
    display: flex; align-items: center; justify-content: center;
  }
  .reg-overlay.hidden { display: none; }
  .reg-card {
    background: var(--card);
    border: 3px solid var(--accent);
    padding: 40px 32px;
    width: 90%; max-width: 440px;
    text-align: center;
    clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 20px) 100%, 0 100%, 0 12px);
    position: relative;
  }
  .reg-card::before {
    content: ''; position: absolute; top: -3px; left: 44px;
    width: 52px; height: 3px; background: var(--accent);
  }
  .reg-title {
    font-family: var(--font-display); font-size: 22px; font-weight: 900;
    letter-spacing: 4px; color: var(--accent);
    text-transform: uppercase; margin-bottom: 8px;
  }
  .reg-sub {
    font-size: 11px; color: var(--text-dim); letter-spacing: 1px;
    margin-bottom: 28px;
  }
  .reg-card input {
    text-align: center; font-size: 18px; font-weight: 700;
    max-width: 280px; margin: 0 auto 16px;
    padding: 12px 16px;
  }
  @media (max-width: 768px) {
    .reg-card { padding: 28px 20px; }
    .reg-title { font-size: 18px; }
  }
}

/* ===== 记忆实验室新增页 ===== */
.review-wrap { max-width: 980px; margin: 0 auto; }
.review-meta { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; font-family:var(--font-mono); font-size:11px; color:var(--text-dim); letter-spacing:1px; }
.review-card { min-height: 300px; display:flex; flex-direction:column; justify-content:center; gap:18px; padding:36px; }
.review-front { font-size: clamp(22px, 2.8vw, 34px); line-height:1.55; font-weight:900; }
.review-back { border-top:2px solid #2a2a2a; padding-top:18px; font-size:15px; line-height:1.9; color:#ddd; white-space:pre-wrap; }
.review-back.hidden { display:none; }
.review-actions { display:flex; gap:10px; margin-top:16px; }
.review-actions .btn { flex:1; height:52px; }
.rating-row { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:14px; }
.rating-btn { border:0; cursor:pointer; padding:12px 8px; text-align:center; color:#fff; background:#171717; clip-path:polygon(10px 0,100% 0,calc(100% - 8px) 100%,0 100%); transition:transform .08s ease, background .1s ease; }
.rating-btn:hover { transform:translateY(-2px); background:#242424; }
.rating-btn b { display:block; font-family:var(--font-display); font-size:16px; letter-spacing:1px; }
.rating-btn span { display:block; font-size:10px; color:#999; margin-top:4px; }
.rating-btn.r1 { border-bottom:3px solid #c46a6a; }
.rating-btn.r2 { border-bottom:3px solid #c9a35a; }
.rating-btn.r3 { border-bottom:3px solid #6fa3bf; }
.rating-btn.r4 { border-bottom:3px solid #6fae8f; }
.cards-toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
.cards-toolbar input, .cards-toolbar select { max-width:240px; }
.card-row { display:flex; gap:14px; align-items:flex-start; padding:14px; background:var(--panel-deep, #0f1b1c); border-left:3px solid var(--border, #2b4141); margin-bottom:6px; min-width:0; }
.card-row:hover { border-left-color:var(--accent); }
.card-row .front { flex:1; min-width:0; font-size:14px; line-height:1.6; overflow-wrap:anywhere; }
.card-row .meta { font-family:var(--font-mono); font-size:10px; color:var(--text-muted); white-space:nowrap; }
.pager { display:flex; gap:8px; align-items:center; justify-content:flex-end; margin-top:12px; font-size:11px; color:var(--text-dim); }
.stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:12px; }
.stat-box { background:var(--panel-deep, #0f1b1c); border:2px solid #1d1d1d; padding:18px; clip-path:polygon(10px 0,100% 0,100% calc(100% - 8px),calc(100% - 14px) 100%,0 100%,0 6px); }
.stat-box .n { font-family:var(--font-display); font-size:38px; line-height:1; color:var(--accent); }
.stat-box .l { font-size:10px; color:var(--text-dim); letter-spacing:1px; margin-top:8px; }
#stats-chart { width:100%; height:340px; }
@media (max-width: 760px) {
  .stats-grid { grid-template-columns:repeat(2,1fr); }
  .review-card { padding:22px; min-height:240px; }
  .rating-row { grid-template-columns:repeat(2,1fr); }
}


/* ===== cool / low-fatigue overrides ===== */
body { background: var(--bg); }
.bg-pattern {
  background:
    repeating-linear-gradient(0deg, transparent, transparent 4px, rgba(231,241,238,0.012) 4px, rgba(231,241,238,0.012) 8px),
    repeating-linear-gradient(90deg, transparent, transparent 48px, rgba(111,199,192,0.025) 48px, rgba(111,199,192,0.025) 49px);
}
.p5-nav { background: linear-gradient(180deg, rgba(13,23,24,0.98) 0%, rgba(13,23,24,0.9) 82%, transparent 100%); }
.logo { text-shadow: 2px 2px 0 #0d1718, 0 0 18px rgba(63,157,149,0.22); }
.nav-tab.active { box-shadow: 0 0 14px rgba(63,157,149,0.18); }
.btn-primary { background: var(--accent); border-color: var(--accent); }
.btn-primary:hover { background: var(--cyan); border-color: var(--cyan); color: #0d1718; }
.p5-card { box-shadow: 0 10px 30px rgba(0,0,0,0.14); }
.card-row { background: var(--panel-soft, #112021); }
.card-row:hover { border-left-color: var(--cyan); }

/* ===== tutor floating window ===== */
.tutor-bubble {
  position: fixed; right: 20px; bottom: 20px; z-index: 60;
  width: 54px; height: 54px; border: 0; cursor: pointer;
  background: var(--accent); color: #071213;
  clip-path: polygon(12px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-family: var(--font-display); font-size: 19px; line-height: 1;
  box-shadow: 0 0 22px rgba(63,157,149,0.28);
}
.tutor-bubble span { font-family: var(--font-body); font-size: 9px; font-weight: 700; margin-top: 2px; letter-spacing: 1px; }
.tutor-bubble:hover { background: var(--cyan); }

/* ===== persona radar ===== */
.persona-grid { display: grid; grid-template-columns: minmax(260px, 420px) 1fr; gap: 24px; align-items: center; }
.persona-radar { width: 100%; max-width: 420px; margin: 0 auto; display: block; }
.persona-controls { display: grid; gap: 7px; padding-right: 64px; }
.main { padding-bottom: 96px; }
.persona-row { display: grid; grid-template-columns: 48px 1fr 32px; gap: 10px; align-items: center; font-size: 12px; color: var(--text-dim); }
.persona-row input[type="range"] { width: 100%; height: 4px; }
.persona-row b { color: var(--cyan); text-align: right; font-family: var(--font-mono); font-size: 11px; }
.persona-note { font-size: 10px; color: var(--text-muted); margin-top: 10px; line-height: 1.6; }
.persona-actions { margin-top: 12px; display: flex; gap: 8px; }
@media (max-width: 760px) { .persona-grid { grid-template-columns: 1fr; } }


/* ===== P3 WHITE / DAYLIGHT THEME (additive) ===== */
html[data-theme="white"] body {
  background:
    radial-gradient(1100px 620px at 8% -12%, rgba(53,209,232,0.24), transparent 62%),
    radial-gradient(900px 520px at 105% 0%, rgba(27,87,255,0.10), transparent 58%),
    linear-gradient(180deg, #f8fcff 0%, #eaf5fb 58%, #e1f0f8 100%);
}
html[data-theme="white"] .bg-pattern {
  background:

.tutor-overlay {
  position: fixed; right: 24px; bottom: 24px; z-index: 80;

.method-pick { display:flex; gap:8px; align-items:flex-start; border:1px solid var(--border); padding:8px; cursor:pointer; }
.method-pick input { margin-top:2px; }
.method-pick b { display:block; font-size:12px; color:var(--text); }
.method-pick small { display:block; font-size:9px; color:var(--text-muted); line-height:1.5; margin-top:2px; }
.review-method-row { display:flex; justify-content:space-between; gap:10px; align-items:center; border-bottom:1px solid var(--border); padding-bottom:8px; }
.review-method-row b { display:block; font-size:12px; color:var(--text); }
.review-method-row small { display:block; font-size:9px; color:var(--text-muted); }
.review-method-row select { min-width:90px; }
@media(max-width:900px){ .method-grid { grid-template-columns:1fr; } }
@media(max-width:600px){ .method-actions { width:100%; } }


.card-actions { display:flex; gap:5px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
.card-actions .btn { padding:4px 8px; font-size:9px; }
.card-back { font-size:11px; color:var(--text-dim); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card-extra { font-size:9px; color:var(--text-muted); margin-top:3px; }
.card-reps { font-family:var(--font-mono); font-size:8px; color:var(--text-muted); margin-top:3px; }
.card-form { padding:14px 18px 18px; display:grid; gap:10px; }
.card-form label { display:grid; gap:4px; font-size:10px; color:var(--text-muted); letter-spacing:.5px; }
.card-form-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.card-form textarea, .card-form input, .card-form select { width:100%; }
.card-form-actions { display:flex; justify-content:flex-end; gap:6px; padding-top:4px; }
@media(max-width:700px){ .card-form-row { grid-template-columns:1fr; } .card-row { align-items:flex-start; } }


@media(max-width:900px){
  .card-row { flex-wrap:wrap; }
  .card-row .front { flex:1 1 100%; }
  .card-row .meta { flex:1 1 auto; }
  .card-row .card-actions { flex:1 1 100%; justify-content:flex-start; }
}


.settings-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
.settings-grid label { display:grid; gap:5px; font-size:11px; color:var(--text-dim); letter-spacing:.5px; }
.settings-range { display:grid; gap:5px; font-size:11px; color:var(--text-dim); margin-bottom:8px; }
.settings-range b { color:var(--accent); font-family:var(--font-mono); }
.settings-note { font-size:10px; color:var(--text-muted); line-height:1.6; margin:4px 0 10px; }
@media(max-width:600px){ .settings-grid { grid-template-columns:1fr; } }


/* ================================================================
   WHITE P3 — P3R breakdown:
   paper white + royal blue + navy ink + cyan/magenta/yellow accents,
   black structural bands, hard diagonal cuts, oversized italic numerals.
   ================================================================ */
html[data-theme="white"] {
  --bg: #f4f9fd;
  --surface: #ffffff;
  --card: #ffffff;
  --panel-deep: #eaf4fb;
  --panel-soft: #f7fbff;
  --border: #a9c9dd;
  --border-strong: #071a5c;
  --text: #071a5c;
  --text-dim: #1b335c;
  --text-muted: #5d7699;
  --accent: #1b57ff;
  --accent-dim: #0a2bd6;
  --red: #f0417f;
  --red-bright: #ff4f8b;
  --blue: #35d1e8;
  --cyan: #35d1e8;
  --green: #1f9d80;
  --pale: #cfeaf6;
  --magenta: #f0417f;
}

html[data-theme="white"] body {
  background:
    linear-gradient(112deg, rgba(20,59,223,0.10) 0 20%, transparent 20.2%),
    radial-gradient(900px 520px at 102% 100%, rgba(53,209,232,0.13), transparent 62%),
    linear-gradient(180deg, #ffffff 0%, #f2f9ff 58%, #e7f4fb 100%);
}
html[data-theme="white"] .bg-pattern::before {
  content: ''; position: absolute; left: -16vw; top: -12vh; width: 34vw; height: 124vh;
  background: linear-gradient(160deg, #143bdf 0%, #1b57ff 58%, #35d1e8 100%);
  clip-path: polygon(0 0, 100% 0, 72% 100%, 0 100%);
  opacity: 0.11;
}
html[data-theme="white"] .bg-pattern::after {
  content: ''; position: absolute; right: -18vw; bottom: -24vh; width: 58vw; height: 58vw;
  border: 2px solid rgba(27,87,255,0.10); border-radius: 50%;
  box-shadow: 0 0 0 24px rgba(53,209,232,0.035), 0 0 0 72px rgba(240,65,127,0.025);
  opacity: 0.9;
}
html[data-theme="white"] .p3-ghost {
  color: rgba(20,59,223,0.07); font-size: clamp(120px, 15vw, 260px); top: 7vh;
  text-shadow: 6px 6px 0 rgba(53,209,232,0.08);
}
html[data-theme="white"] .p3-ghost span:nth-child(2) { color: rgba(53,209,232,0.18); }
html[data-theme="white"] .p3-ghost span:nth-child(3) { color: rgba(240,65,127,0.09); }

/* Navigation: white paper with navy border + cyan underline */
html[data-theme="white"] .p5-nav {
  background: #ffffff;
  border-bottom: 4px solid #071a5c;
  box-shadow: 0 4px 0 #35d1e8;
  padding: 10px 16px 12px;
}
html[data-theme="white"] .p5-nav .logo {
  color: #071a5c; text-shadow: 3px 3px 0 #35d1e8, 4px 4px 0 #cfeaf6;
}
html[data-theme="white"] .p5-nav .logo span { color: #1b57ff; }
html[data-theme="white"] .nav-tab {
  background: #ffffff; color: #071a5c; border: 2px solid #071a5c;
  box-shadow: 3px 3px 0 #cfeaf6;
}
html[data-theme="white"] .nav-tab:hover {
  background: #eaf4fb; color: #071a5c; border-color: #1b57ff;
  box-shadow: 3px 3px 0 #35d1e8;
}
html[data-theme="white"] .nav-tab.active {
  background: #1b57ff; color: #fff; border-color: #071a5c;
  box-shadow: 4px 4px 0 #071a5c;
}
html[data-theme="white"] .nav-ver { color: #5d7699; }
html[data-theme="white"] .nav-ver b { color: #f0417f; }

/* Cards become white paper with a navy full-bleed masthead */
html[data-theme="white"] .p5-card {
  background: #ffffff;
  border: 2px solid #071a5c;
  box-shadow: 8px 8px 0 rgba(20,59,223,0.14);
  padding: 0 20px 20px;
  clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 16px) 100%, 0 100%, 0 10px);
}
html[data-theme="white"] .p5-card:hover { border-color: #1b57ff; }
html[data-theme="white"] .p5-card::after,
html[data-theme="white"] .p5-card::before { display: none; }
html[data-theme="white"] .p5-card-header {
  margin: 0 -20px 16px;
  padding: 12px 18px 11px 20px;
  color: #ffffff; font-style: italic; font-size: 14px; letter-spacing: 2px;
  background: linear-gradient(100deg, #05070d 0%, #071a5c 38%, #0a2bd6 100%);
  border-bottom: 3px solid #35d1e8;
  box-shadow: inset 6px 0 0 #1b57ff;
  clip-path: polygon(0 0, 100% 0, calc(100% - 18px) 100%, 0 100%);
}
html[data-theme="white"] .p5-card-header .btn {
  background: #ffffff; color: #071a5c; border-color: #ffffff;
  box-shadow: 2px 2px 0 #35d1e8; font-style: normal;
}
html[data-theme="white"] .p5-card-header .btn:hover { background: #eaf4fb; border-color: #35d1e8; }
html[data-theme="white"] .p5-card-header .persona-sub { color: #35d1e8; }

/* Numbers and stat blocks */
html[data-theme="white"] .stat-box {
  background: #fff; border: 2px solid #071a5c; box-shadow: 4px 4px 0 #cfeaf6;
  padding: 16px 18px;
}
html[data-theme="white"] .stat-box .n {
  color: #1b57ff; font-style: italic; font-size: 44px; letter-spacing: -1.5px;
  text-shadow: 3px 3px 0 #e2f1fa;
}
html[data-theme="white"] .stat-box:nth-child(3n+2) .n { color: #071a5c; }
html[data-theme="white"] .stat-box:nth-child(3n) .n { color: #f0417f; }
html[data-theme="white"] .stat-box .l { color: #1b335c; font-weight: 700; }

/* Card browser */
html[data-theme="white"] .card-row {
  background: #fff; border: 1px solid #a9c9dd; border-left: 5px solid #071a5c;
  box-shadow: 4px 4px 0 #e2f1fa;
}
html[data-theme="white"] .card-row:hover { border-left-color: #1b57ff; box-shadow: 4px 4px 0 #cfeaf6; }
html[data-theme="white"] .card-row .front { color: #071a5c; font-weight: 600; }
html[data-theme="white"] .card-row .meta { color: #1b335c; }

/* Hard-edged buttons */
html[data-theme="white"] .btn {
  background: #fff; border: 2px solid #071a5c; color: #071a5c;
  box-shadow: 3px 3px 0 #cfeaf6; font-style: italic;
}
html[data-theme="white"] .btn:hover {
  background: #eaf4fb; border-color: #1b57ff; color: #071a5c;
  box-shadow: 3px 3px 0 #35d1e8;
}
html[data-theme="white"] .btn-primary {
  background: #1b57ff; border-color: #071a5c; color: #fff;
  box-shadow: 3px 3px 0 #071a5c;
}
html[data-theme="white"] .btn-primary:hover { background: #0a2bd6; border-color: #071a5c; color: #fff; }
html[data-theme="white"] .btn-danger { background: #f0417f; border-color: #071a5c; color: #fff; box-shadow: 3px 3px 0 #071a5c; }
html[data-theme="white"] .btn-danger:hover { background: #d92f6d; border-color: #071a5c; color: #fff; }
html[data-theme="white"] .btn-warning { background: #ffd400; border-color: #071a5c; color: #071a5c; box-shadow: 3px 3px 0 #071a5c; }
html[data-theme="white"] .btn-warning:hover { background: #ffdf33; border-color: #071a5c; color: #071a5c; }
html[data-theme="white"] .btn-success { background: #35d1e8; border-color: #071a5c; color: #071a5c; box-shadow: 3px 3px 0 #071a5c; }
html[data-theme="white"] .btn-success:hover { background: #63e2f2; border-color: #071a5c; color: #071a5c; }

/* Inputs */
html[data-theme="white"] input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="file"]),
html[data-theme="white"] textarea,
html[data-theme="white"] select {
  background: #fff; border: 2px solid #7fa6c4; color: #071a5c;
}
html[data-theme="white"] input:focus, html[data-theme="white"] textarea:focus, html[data-theme="white"] select:focus {
  border-color: #1b57ff; box-shadow: 3px 3px 0 #cfeaf6;
}
html[data-theme="white"] .cards-toolbar input,
html[data-theme="white"] .cards-toolbar select { border-color: #071a5c; }

/* Chats, docs, method cards */
html[data-theme="white"] .chat-container { border: 2px solid #071a5c; box-shadow: 6px 6px 0 #e2f1fa; }
html[data-theme="white"] .chat-msg.user { background: #1b57ff; color: #fff; }
html[data-theme="white"] .chat-msg.assistant { background: #f2f9fd; border-color: #a9c9dd; color: #071a5c; }
html[data-theme="white"] .doc-viewer { border: 2px solid #071a5c; }
html[data-theme="white"] .method-card { background:#fff; border:2px solid #071a5c; box-shadow:4px 4px 0 #e2f1fa; }
html[data-theme="white"] .method-day { border-color:#a9c9dd; color:#3d5f85; }
html[data-theme="white"] .method-foot { border-top-color:#cfeaf6; color:#5d7699; }
html[data-theme="white"] .p5-modal { background:#fff; border:3px solid #071a5c; box-shadow:10px 10px 0 rgba(20,59,223,.18); }
html[data-theme="white"] .p5-modal .p5-card-header { margin:0 -20px 14px; }
html[data-theme="white"] .pager { color:#1b335c; }

/* Persona tabs / labels keep the deep blue, but sit inside the new framework */
html[data-theme="white"] .persona-viewtab { background:#fff; border:2px solid #071a5c; color:#071a5c; box-shadow:2px 2px 0 #cfeaf6; }
html[data-theme="white"] .persona-viewtab.active { background:#1b57ff; border-color:#071a5c; color:#fff; box-shadow:3px 3px 0 #071a5c; }
html[data-theme="white"] .ps-tag { background:#071a5c; border-color:#071a5c; color:#fff; }
html[data-theme="white"] .ps-level { background:#35d1e8; color:#071a5c; }
html[data-theme="white"] .ps-sub { color:#1b335c; }

/* Tables / modals spacing */
html[data-theme="white"] .modal-overlay { background: rgba(7,26,92,0.55); }
html[data-theme="white"] .method-meta { color:#3d5f85; }
html[data-theme="white"] .settings-note { color:#3d5f85; }


html[data-theme="white"] .rating-btn {
  background: #fff; border: 2px solid #071a5c; color: #071a5c; box-shadow: 4px 4px 0 #cfeaf6;
}
html[data-theme="white"] .rating-btn:hover { background: #eaf4fb; box-shadow: 4px 4px 0 #35d1e8; }
html[data-theme="white"] .rating-btn b { color: #071a5c; }
html[data-theme="white"] .rating-btn span { color: #3d5f85; }
html[data-theme="white"] .rating-btn.r1 { border-bottom: 5px solid #f0417f; }
html[data-theme="white"] .rating-btn.r2 { border-bottom: 5px solid #ffd400; }
html[data-theme="white"] .rating-btn.r3 { border-bottom: 5px solid #1b57ff; }
html[data-theme="white"] .rating-btn.r4 { border-bottom: 5px solid #35d1e8; }


.settings-layout { max-width:1180px; margin:0 auto; display:grid; grid-template-columns:minmax(0,1.25fr) minmax(300px,.85fr); gap:16px; align-items:start; }
.settings-col { display:grid; gap:16px; min-width:0; }
@media(max-width:900px){ .settings-layout { grid-template-columns:1fr; } }


html[data-theme="white"] .review-meta {
  background: #071a5c; color: #fff; border: 2px solid #071a5c;
  box-shadow: 4px 4px 0 #35d1e8; padding: 8px 14px; margin-bottom: 10px;
}
html[data-theme="white"] .review-meta span { color: #fff; }
html[data-theme="white"] .review-meta span:last-child { color: #35d1e8; }


/* Review page: asymmetric P3R layout with session rail */
.review-wrap { max-width:1180px; display:grid; grid-template-columns:minmax(0,1.6fr) minmax(250px,.7fr); grid-template-rows:auto auto 1fr; column-gap:16px; align-items:start; }
.review-wrap .review-meta { grid-column:1; grid-row:1; }
.review-wrap .review-card { grid-column:1; grid-row:2; }
.review-wrap .review-actions, .review-wrap .rating-row { grid-column:1; grid-row:3; }
.review-wrap > .empty-state, .review-wrap > .error-state { grid-column:1 / -1; }
.review-rail { grid-column:2; grid-row:1 / span 3; background:var(--card); border:2px solid var(--border-strong, #2b4141); padding:16px; margin-top:0; }
.review-rail-title { font-family:var(--font-display); font-size:13px; font-weight:900; letter-spacing:2px; color:var(--accent); border-bottom:2px solid var(--border); padding-bottom:9px; margin-bottom:4px; }
.rail-stat { display:flex; justify-content:space-between; align-items:baseline; gap:8px; padding:10px 0; border-bottom:1px solid var(--border); }
.rail-stat span { font-family:var(--font-mono); font-size:9px; color:var(--text-muted); letter-spacing:1px; }
.rail-stat b { font-family:var(--font-display); font-style:italic; font-size:20px; color:var(--accent); line-height:1; }
.rail-note { font-size:10px; line-height:1.7; color:var(--text-muted); padding-top:12px; }
.review-delete-btn {
  width: 100%; margin-top: 14px; padding: 9px 10px; cursor: pointer;
  border: 1px solid #9c3a32; background: #f3e9df; color: #7e2a24;
  font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: 1.2px;
}
.review-delete-btn:hover { background: #9c3a32; color: #fff; }
.review-delete-btn:disabled { opacity: .45; cursor: default; }
html[data-theme="black"] .review-delete-btn { border-color:#e0a09a; color:#7e2a24; background:#f3e9df; }
html[data-theme="black"] .review-delete-btn:hover { background:#c46a6a; color:#0d1718; }
html[data-theme="black"] .review-delete-btn:disabled { color:#e0a09a; }
html[data-theme="white"] .review-delete-btn { border-color:#f0417f; color:#c0265c; background:#fff; }
html[data-theme="white"] .review-delete-btn:hover { background:#f0417f; color:#fff; }
html[data-theme="white"] .review-rail { background:#fff; border:2px solid #071a5c; box-shadow:8px 8px 0 #cfeaf6; }
html[data-theme="white"] .review-rail-title { color:#fff; background:#071a5c; border-bottom:3px solid #35d1e8; margin:-16px -16px 4px; padding:11px 14px 10px; clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%); }
html[data-theme="white"] .rail-stat { border-bottom-color:#cfeaf6; }
html[data-theme="white"] .rail-stat span { color:#3d5f85; }
html[data-theme="white"] .rail-stat b { color:#1b57ff; }
html[data-theme="white"] .rail-note { color:#3d5f85; }
@media(max-width:900px){ .review-wrap { grid-template-columns:1fr; } .review-rail { grid-column:1; grid-row:auto; margin-top:4px; } }


/* ================================================================
   P3RE wave motion — adapted from the supplied web-effect reference:
   five layered SVG waterlines, curtain drop, delayed copy, wipe transition.
   ================================================================ */
.p3-intro {
  position: fixed; inset: 0; z-index: 999; overflow: hidden;
  background:
    radial-gradient(1000px 700px at 78% 20%, rgba(53,209,232,0.55), transparent 55%),
    linear-gradient(160deg, #06134a 0%, #0a2bd6 44%, #143bdf 72%, #06134a 100%);
  transform: translateY(0); opacity: 1;
  transition: transform .9s cubic-bezier(.77,0,.18,1), opacity .6s ease;
}
.p3-intro.is-out { transform: translateY(-108%); opacity: .92; }
.p3-intro-waves { position: absolute; left: -6%; right: -6%; bottom: -8vh; height: 48vh; pointer-events: none; }
.p3-intro-waves img {
  position: absolute; left: -3%; width: 106%; height: auto; opacity: .72;
  filter: brightness(1.55) saturate(1.2) drop-shadow(0 -1px 0 rgba(255,255,255,.16)); mix-blend-mode: screen;
}
.p3-intro-waves img:nth-child(1) { bottom: 0; opacity: .85; animation: p3-wave-1 5s ease-in-out infinite; }
.p3-intro-waves img:nth-child(2) { bottom: 3vh; opacity: .68; animation: p3-wave-2 4.2s ease-in-out infinite; }
.p3-intro-waves img:nth-child(3) { bottom: 6vh; opacity: .56; animation: p3-wave-3 3.6s ease-in-out infinite; }
.p3-intro-waves img:nth-child(4) { bottom: 9vh; opacity: .42; animation: p3-wave-4 3.1s ease-in-out infinite; }
.p3-intro-waves img:nth-child(5) { bottom: 12vh; opacity: .30; animation: p3-wave-5 2.7s ease-in-out infinite; }
@keyframes p3-wave-1 { 50% { transform: translateY(30px); } }
@keyframes p3-wave-2 { 50% { transform: translateY(24px); } }
@keyframes p3-wave-3 { 50% { transform: translateY(18px); } }
@keyframes p3-wave-4 { 50% { transform: translateY(14px); } }
@keyframes p3-wave-5 { 50% { transform: translateY(10px); } }
.p3-intro-slash {
  position: absolute; top: -10%; right: 10vw; width: 24vw; height: 120%;
  background: rgba(255,255,255,.07);
  clip-path: polygon(26% 0, 100% 0, 74% 100%, 0 100%);
  pointer-events: none;
}
.p3-intro-copy {
  position: absolute; left: 10vw; top: 50%; transform: translateY(-50%);
  z-index: 3; color: #fff; max-width: 72vw;
  animation: p3-copy-in 1.1s .42s cubic-bezier(.16,1,.3,1) both;
}
.p3-intro-kicker {
  display: inline-block; background: #ffd400; color: #071a5c;
  font-family: var(--font-mono); font-size: 11px; font-weight: 900;
  letter-spacing: 4px; padding: 5px 12px; transform: skewX(-8deg);
  margin-bottom: 18px;
}
.p3-intro-copy h1 {
  margin: 0; font-family: var(--font-display); font-style: italic; font-weight: 900;
  font-size: clamp(68px, 10vw, 162px); line-height: .82; letter-spacing: -5px;
  text-transform: uppercase; text-shadow: 8px 8px 0 rgba(4,10,38,.35);
}
.p3-intro-copy h1 em { color: #35d1e8; font-style: normal; margin-left: .06em; }
.p3-intro-copy p {
  margin: 24px 0 0; font-family: var(--font-mono); font-size: 12px;
  letter-spacing: 3px; line-height: 1.8; color: rgba(255,255,255,.82);
}
.p3-intro-copy p span { color: #ffd400; letter-spacing: 2px; }
.p3-intro-skip {
  position: absolute; right: 34px; bottom: 28px; z-index: 4;
  background: transparent; border: 1px solid rgba(255,255,255,.65); color: #fff;
  padding: 9px 16px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 2px;
  cursor: pointer; transform: skewX(-6deg);
}
.p3-intro-skip:hover { background: #fff; color: #071a5c; }
@keyframes p3-copy-in {
  from { opacity: 0; transform: translateY(calc(-50% + 34px)); }
  to { opacity: 1; transform: translateY(-50%); }
}
html[data-theme="black"] .p3-intro {
  background:
    radial-gradient(900px 600px at 78% 22%, rgba(212,0,0,.48), transparent 58%),
    linear-gradient(160deg, #030303 0%, #1a0505 52%, #6a0000 100%);
}
html[data-theme="black"] .p3-intro-waves img { filter: hue-rotate(150deg) saturate(1.8) brightness(.85); }
html[data-theme="black"] .p3-intro-copy h1 em { color: #d40000; }
html[data-theme="black"] .p3-intro-kicker { background: #d40000; color: #fff; }
html[data-theme="black"] .p3-intro-copy p span { color: #d40000; }

.page-wipe { position: fixed; inset: 0; z-index: 29; pointer-events: none; overflow: hidden; opacity: 0; }
.page-wipe span {
  position: absolute; inset: -20% -20%; display: block;
  background: linear-gradient(105deg, transparent 0 34%, #1b57ff 34% 52%, #35d1e8 52% 56%, #071a5c 56% 60%, transparent 60%);
  transform: translateX(-125%) skewX(-12deg);
}
.page-wipe.run { animation: p3-wipe-fade .62s ease-out both; }
.page-wipe.run span { animation: p3-wipe-sweep .62s cubic-bezier(.7,0,.2,1) both; }
@keyframes p3-wipe-fade { 0%,100% { opacity: 0; } 12%,78% { opacity: .9; } }
@keyframes p3-wipe-sweep { 0% { transform: translateX(-125%) skewX(-12deg); } 100% { transform: translateX(125%) skewX(-12deg); } }

.p3-waterline {
  position: fixed; left: 0; right: 0; bottom: -5px; height: 110px; z-index: 0;
  overflow: hidden; pointer-events: none; opacity: .34;
}
.p3-waterline img {
  position: absolute; left: -4%; width: 108%; height: auto; opacity: .45;
  filter: brightness(1.25) saturate(.85);
}
.p3-waterline img:nth-child(1) { bottom: -12px; animation: p3-wave-1 6s ease-in-out infinite; }
.p3-waterline img:nth-child(2) { bottom: 4px; opacity: .28; animation: p3-wave-3 4.5s ease-in-out infinite; }
.p3-waterline img:nth-child(3) { bottom: 14px; opacity: .16; animation: p3-wave-5 3.4s ease-in-out infinite; }
html[data-theme="black"] .p3-waterline { display: none; }

/* Page/card motion */
#main-content > * { animation: p3-page-in .46s cubic-bezier(.16,1,.3,1) both; }
@keyframes p3-page-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
.p5-nav .logo { animation: p3-logo-in .8s .18s cubic-bezier(.16,1,.3,1) both; }
@keyframes p3-logo-in { from { opacity: 0; transform: skewX(-8deg) translateX(-26px); } to { opacity: 1; transform: skewX(-8deg) translateX(0); } }
html[data-theme="white"] .p5-card {
  transition: transform .22s cubic-bezier(.16,1,.3,1), box-shadow .22s ease, border-color .22s ease;
}
html[data-theme="white"] .p5-card:hover {
  transform: translate(-3px,-3px);
  box-shadow: 12px 12px 0 rgba(20,59,223,.16);
}
html[data-theme="white"] .p5-card::before {
  display: block; content: ''; position: absolute; top: 0; bottom: 0; left: -34%;
  width: 20%; z-index: 2; pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(53,209,232,.28), transparent);
  transform: skewX(-18deg); opacity: 0;
  transition: left .6s cubic-bezier(.16,1,.3,1), opacity .3s ease;
}
html[data-theme="white"] .p5-card:hover::before { left: 118%; opacity: 1; }
html[data-theme="white"] .p5-card > * { position: relative; z-index: 3; }
html[data-theme="white"] .method-card { transition: transform .2s ease, box-shadow .2s ease; }
html[data-theme="white"] .method-card:hover { transform: translate(-2px,-2px); box-shadow: 7px 7px 0 #cfeaf6; }
.p3-intro.is-out ~ .page-wipe { opacity: 0; }

@media (prefers-reduced-motion: reduce) {
  .p3-intro, .p3-intro-copy, .p3-intro-waves img, .p3-waterline img,
  #main-content > *, .p5-nav .logo, .page-wipe span { animation: none !important; transition: none !important; }
  .p3-intro { display: none !important; }
}


html[data-theme="black"] .page-wipe span {
  background: linear-gradient(105deg, transparent 0 34%, #d40000 34% 52%, #7a0000 52% 56%, #000 56% 60%, transparent 60%);
}


/* ================================================================
   BLACK P5 — calling-card skin language:
   ink black, calling-card red #e60012, paper #f7f4ee, cut paper,
   red offset shadows, Anton / Archivo / heavy condensed type.
   White P3R is intentionally untouched.
   ================================================================ */
@font-face {
  font-family: 'P5 Anton'; src: url('assets/fonts/Anton-Regular.ttf') format('truetype');
  font-weight: 400; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'P5 Archivo'; src: url('assets/fonts/ArchivoBlack-Regular.ttf') format('truetype');
  font-weight: 400; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'P5 Latin'; src: url('assets/fonts/BarlowSemiCondensed-SemiBold.woff2') format('woff2');
  font-weight: 500 699; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'P5 Latin'; src: url('assets/fonts/BarlowSemiCondensed-ExtraBold.woff2') format('woff2');
  font-weight: 700 1000; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'P5 Heavy'; src: url('assets/fonts/CcHeavyBold-SC.woff2') format('woff2');
  font-weight: 500 900; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'P5 Sans'; src: url('assets/fonts/CcSans-SC.woff2') format('woff2');
  font-weight: 400; font-style: normal; font-display: swap;
}

html[data-theme="black"] {
  --bg: #000000;
  --surface: #0c0c0c;
  --card: #0c0c0c;
  --panel-deep: #111111;
  --panel-soft: #141414;
  --border: #3a3a3a;
  --border-strong: #f7f4ee;
  --text: #f7f4ee;
  --text-dim: #e4ddd2;
  --text-muted: #b9b3a8;
  --accent: #e60012;
  --accent-dim: #b8000e;
  --red: #e60012;
  --red-bright: #ff3347;
  --blue: #d6ff4a;
  --cyan: #d6ff4a;
  --green: #d6ff4a;
  --pale: #f7f4ee;
  --magenta: #e60012;
  --dark-pattern: #1a1a1a;
  --font-display: 'P5 Anton', 'P5 Heavy', 'Arial Black', Impact, sans-serif;
  --font-body: 'P5 Latin', 'P5 Sans', 'Microsoft YaHei UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
  --font-mono: 'Courier New', monospace;
}
html[data-theme="black"] body {
  background:
    radial-gradient(1000px 700px at 92% 8%, rgba(230,0,18,.11), transparent 62%),
    #000000;
  color: #f7f4ee;
}
html[data-theme="black"] .bg-pattern {
  background: #000000;
}
html[data-theme="black"] .bg-pattern::before {
  content: ''; position: absolute; left: -8%; right: -8%; bottom: -18%; height: 46%;
  background: #e60012;
  clip-path: polygon(0 84%, 100% 18%, 100% 27%, 22% 100%, 0 100%);
  opacity: .58;
}
html[data-theme="black"] .bg-pattern::after {
  content: ''; position: absolute; right: -10%; top: -14%; width: 62%; height: 70%;
  background: url('assets/p5/star-field.svg') center / 760px auto repeat;
  opacity: .085; transform: rotate(-15deg); mix-blend-mode: screen;
}
html[data-theme="black"] .p3-ghost {
  display: block; position: fixed; left: -4vw; top: 8vh; z-index: 0;
  pointer-events: none; user-select: none;
  font-family: var(--font-display); font-style: normal; font-weight: 400;
  font-size: clamp(110px, 14vw, 240px); line-height: .78; letter-spacing: -.02em;
  color: rgba(247,244,238,.045); transform: rotate(-8deg);
}
html[data-theme="black"] .p3-ghost span { display: block; }
html[data-theme="black"] .p3-ghost span:nth-child(2) { margin-left: 8vw; color: rgba(230,0,18,.12); }
html[data-theme="black"] .p3-ghost span:nth-child(3) { margin-left: 1vw; color: rgba(247,244,238,.03); }

/* Navigation becomes a row of paper calling-card tickets */
html[data-theme="black"] .p5-nav {
  background: #0c0c0c;
  border-bottom: 3px solid #f7f4ee;
  box-shadow: 0 4px 0 #e60012;
  padding: 10px 16px 12px;
  gap: 1px;
  flex-wrap: wrap;
}
html[data-theme="black"] .p5-nav .logo {
  color: #f7f4ee; font-family: var(--font-display); font-size: 30px; font-weight: 400;
  letter-spacing: -.02em; text-shadow: 4px 4px 0 #e60012; transform: rotate(-3deg) skewX(-6deg);
  margin-right: 18px;
}
html[data-theme="black"] .p5-nav .logo span {
  color: #e60012; font-size: 15px; font-family: 'P5 Archivo', sans-serif;
  text-shadow: none; margin-left: 5px; letter-spacing: 0;
}
html[data-theme="black"] .nav-tab {
  background: #f7f4ee; color: #0c0c0c; border: 3px solid #0c0c0c;
  box-shadow: 3px 3px 0 #e60012; font-family: var(--font-body); font-weight: 900;
  font-size: 10px; letter-spacing: .5px; text-transform: uppercase;
  transform: rotate(-2deg); margin: 1px 2px 3px 0;
}
html[data-theme="black"] .nav-tab > * { transform: none; }
html[data-theme="black"] .nav-tab:nth-child(even) { transform: rotate(1.5deg); }
html[data-theme="black"] .nav-tab:hover {
  background: #e60012; color: #fff; border-color: #0c0c0c;
  box-shadow: 4px 4px 0 #f7f4ee;
}
html[data-theme="black"] .nav-tab.active {
  background: #e60012; color: #fff; border-color: #0c0c0c;
  box-shadow: 4px 4px 0 #f7f4ee; z-index: 3;
}
html[data-theme="black"] .nav-ver { color: #f7f4ee; font-family: 'P5 Anton', sans-serif; letter-spacing: 1px; }
html[data-theme="black"] .nav-ver b { color: #e60012; }
html[data-theme="black"] .theme-toggle {
  background: #f7f4ee; color: #0c0c0c; border: 3px solid #0c0c0c;
  box-shadow: 3px 3px 0 #e60012; transform: rotate(1.5deg);
}
html[data-theme="black"] .theme-toggle:hover { background: #e60012; color: #fff; }
html[data-theme="black"] .main { padding-top: 82px; }

/* Paper-card frames */
html[data-theme="black"] .p5-card {
  background: #0c0c0c;
  border: 2px solid #f7f4ee;
  box-shadow: 8px 8px 0 #e60012;
  padding: 0 20px 20px;
  clip-path: polygon(.7% 1.5%, 100% 0, 99.3% 98.5%, 0 100%);
  transition: transform .2s cubic-bezier(.2,1.5,.35,1), box-shadow .2s ease, border-color .2s ease;
}
html[data-theme="black"] .p5-card:hover {
  border-color: #ffffff; transform: translate(-2px,-2px);
  box-shadow: 10px 10px 0 #e60012;
}
html[data-theme="black"] .p5-card-header {
  margin: 0 -20px 16px; padding: 10px 16px 9px 20px;
  background: #f7f4ee; color: #0c0c0c;
  border-bottom: 0; box-shadow: inset 8px 0 0 #e60012;
  font-family: var(--font-display); font-size: 17px; font-weight: 400;
  font-style: normal; letter-spacing: .035em;
  clip-path: polygon(0 0, 100% 0, 99% 100%, 0 92%);
  transform: rotate(-1deg);
}
html[data-theme="black"] .p5-card-header .btn {
  background: #0c0c0c; color: #f7f4ee; border-color: #0c0c0c;
  box-shadow: 2px 2px 0 #e60012; font-style: normal;
}
html[data-theme="black"] .p5-card-header .btn:hover { background: #e60012; color: #fff; }
html[data-theme="black"] .p5-card-header .persona-sub { color: #e60012; }

/* Stat panels become white paper status cards */
html[data-theme="black"] .stat-box {
  background: #f7f4ee; color: #0c0c0c; border: 2px solid #0c0c0c;
  box-shadow: 5px 5px 0 #e60012; transform: rotate(-.6deg);
}
html[data-theme="black"] .stat-box:nth-child(even) { transform: rotate(.6deg); }
html[data-theme="black"] .stat-box .n {
  color: #e60012; font-family: var(--font-display); font-size: 48px;
  font-style: normal; line-height: .9; text-shadow: 2px 2px 0 #0c0c0c;
}
html[data-theme="black"] .stat-box .l {
  color: #0c0c0c; font-family: var(--font-body); font-weight: 700; letter-spacing: .5px;
}

/* Calling-card buttons */
html[data-theme="black"] .btn {
  background: #f7f4ee; color: #0c0c0c; border: 2px solid #0c0c0c;
  box-shadow: 3px 3px 0 #e60012;
  font-family: var(--font-body); font-weight: 900;
  transform: rotate(-1deg) skewX(-3deg);
}
html[data-theme="black"] .btn:hover {
  background: #e60012; color: #fff; border-color: #0c0c0c;
  box-shadow: 4px 4px 0 #f7f4ee;
}
html[data-theme="black"] .btn-primary {
  background: #e60012; color: #fff; border-color: #0c0c0c; box-shadow: 3px 3px 0 #0c0c0c;
}
html[data-theme="black"] .btn-primary:hover { background: #ff1f33; color: #fff; }
html[data-theme="black"] .btn-danger {
  background: #0c0c0c; color: #fff; border-color: #e60012; box-shadow: 3px 3px 0 #e60012;
}
html[data-theme="black"] .btn-danger:hover { background: #e60012; color: #fff; }
html[data-theme="black"] .btn-success {
  background: #d6ff4a; color: #0c0c0c; border-color: #0c0c0c; box-shadow: 3px 3px 0 #0c0c0c;
}
html[data-theme="black"] .btn-warning {
  background: #ffb020; color: #0c0c0c; border-color: #0c0c0c; box-shadow: 3px 3px 0 #0c0c0c;
}

/* Inputs stay readable, framed as paper/ink slips */
html[data-theme="black"] input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="file"]),
html[data-theme="black"] textarea,
html[data-theme="black"] select {
  background: #141414; color: #f7f4ee; border: 2px solid #f7f4ee;
}
html[data-theme="black"] input:focus, html[data-theme="black"] textarea:focus, html[data-theme="black"] select:focus {
  border-color: #e60012; box-shadow: 3px 3px 0 #e60012;
}
html[data-theme="black"] input::placeholder, html[data-theme="black"] textarea::placeholder { color: #8d887f; }
html[data-theme="black"] select option { background: #141414; color: #f7f4ee; }

/* Card browser: each row is a paper thief notice */
html[data-theme="black"] .card-row {
  background: #f7f4ee; color: #0c0c0c;
  border: 2px solid #0c0c0c; border-left: 9px solid #e60012;
  box-shadow: 5px 5px 0 #0c0c0c;
  transform: rotate(-.45deg);
}
html[data-theme="black"] .card-row:nth-child(even) { transform: rotate(.45deg); }
html[data-theme="black"] .card-row:hover {
  border-left-color: #e60012; box-shadow: 7px 7px 0 #e60012;
  transform: translate(2px,-2px) rotate(0deg);
}
html[data-theme="black"] .card-row .front { color: #0c0c0c; font-weight: 700; }
html[data-theme="black"] .card-row .meta { color: #4a4a4a; }
html[data-theme="black"] .card-back { color: #333333; }
html[data-theme="black"] .card-extra, html[data-theme="black"] .card-reps { color: #5d574f; }

/* Transcripts */

}
html[data-theme="black"] .chat-msg.user {

  box-shadow: 4px 4px 0 #e60012; transform: rotate(-.8deg);
}
html[data-theme="black"] .chat-msg.assistant {
  background: #f7f4ee; color: #0c0c0c; border: 2px solid #0c0c0c;
  box-shadow: 4px 4px 0 #e60012; transform: rotate(.5deg);
}
html[data-theme="black"] .chat-msg.assistant a { color: #e60012; font-weight: 700; }
html[data-theme="black"] .chat-input-row input { background: #141414; color: #f7f4ee; }

/* Review card and session rail */
html[data-theme="black"] .review-meta {
  background: #f7f4ee; color: #0c0c0c; border: 2px solid #0c0c0c;
  box-shadow: 4px 4px 0 #e60012; padding: 8px 14px; margin-bottom: 10px;
}
html[data-theme="black"] .review-meta span { color: #0c0c0c; }
html[data-theme="black"] .review-meta span:last-child { color: #e60012; font-weight: 900; }
html[data-theme="black"] .review-card {

}
html[data-theme="black"] .review-front { color: #0c0c0c; font-family: var(--font-body); }
html[data-theme="black"] .review-back { color: #222222; border-top-color: #0c0c0c; }
html[data-theme="black"] .review-rail {

}
html[data-theme="black"] .review-rail-title {
  color: #f7f4ee; background: #e60012; border-bottom: 3px solid #f7f4ee;

html[data-theme="black"] .rail-stat { border-bottom-color: #3a3a3a; }
html[data-theme="black"] .rail-stat span { color: #b9b3a8; }
html[data-theme="black"] .rail-stat b { color: #f7f4ee; }
html[data-theme="black"] .rail-note { color: #b9b3a8; }
html[data-theme="black"] .rating-btn {

html[data-theme="black"] .rating-btn b { color: #0c0c0c; }
html[data-theme="black"] .rating-btn span { color: #4a4a4a; }
html[data-theme="black"] .rating-btn:hover { background: #e60012; color: #fff; }

html[data-theme="black"] .rating-btn.r2 { border-bottom-color: #ffb020; }

html[data-theme="black"] .rating-btn.r4 { border-bottom-color: #f7f4ee; }

/* Method lab cards */
html[data-theme="black"] .method-card {
  background: #f7f4ee; color: #0c0c0c; border: 2px solid #0c0c0c;
  box-shadow: 5px 5px 0 #e60012; transform: rotate(-.4deg);
}
html[data-theme="black"] .method-card:nth-child(even) { transform: rotate(.4deg); }
html[data-theme="black"] .method-name { color: #0c0c0c; }
html[data-theme="black"] .method-desc { color: #4a4a4a; }

html[data-theme="black"] .method-star.on { color: #e60012; }

html[data-theme="black"] .method-meta { color: #b9b3a8; }

/* Forms / secondary menus */

html[data-theme="black"] .persona-note { color: #b9b3a8; }

html[data-theme="black"] .ps-head b { color: #e60012; }
html[data-theme="black"] .ps-bar { background: #3a3a3a; }
html[data-theme="black"] .ps-bar i { background: #e60012; }
html[data-theme="black"] .ps-note { color: #b9b3a8; }

/* Docs viewer: paper sheet */
html[data-theme="black"] .doc-viewer {
  background: #f7f4ee; color: #0c0c0c; border: 2px solid #0c0c0c;
  box-shadow: 8px 8px 0 #e60012;
}
html[data-theme="black"] .doc-viewer h2,
html[data-theme="black"] .doc-viewer h3,
html[data-theme="black"] .chapter-title {

html[data-theme="black"] .doc-viewer .block-text { color: #0c0c0c; }

/* Keep the five-dim star gold, but frame it as a calling-card relic */

/* ================================================================
   Transition ordering + theme-specific opening films
   ================================================================ */
.page-wipe {
  position: fixed; inset: 0; z-index: 500;
  pointer-events: none; overflow: hidden;
  visibility: hidden; opacity: 1;
}
.page-wipe.is-active { visibility: visible; }
.page-wipe .wipe-cover {
  position: absolute; inset: -18% -12%;
  z-index: 1; display: block;
  background: #f7f4ee;
  transform: translateX(-120%) skewX(-12deg);
  transition: transform .32s cubic-bezier(.65,0,.2,1);
}
.page-wipe .wipe-cut {
  position: absolute; inset: -18% -12%;
  z-index: 2; display: block;
  background: #1b57ff;
  clip-path: polygon(0 58%, 100% 28%, 100% 38%, 0 68%);
  transform: translateX(-135%) skewX(-12deg);
  transition: transform .48s cubic-bezier(.65,0,.2,1);
}
.page-wipe.is-cover .wipe-cover { transform: translateX(0) skewX(-12deg); }
.page-wipe.is-cover .wipe-cut { transform: translateX(0) skewX(-12deg); }
.page-wipe.is-out .wipe-cover {
  transform: translateX(120%) skewX(-12deg);
  transition-duration: .42s;
}
.page-wipe.is-out .wipe-cut {
  transform: translateX(135%) skewX(-12deg);
  transition-duration: .44s;
}
html[data-theme="black"] .page-wipe .wipe-cover { background: #0c0c0c; }
html[data-theme="black"] .page-wipe .wipe-cut { background: #e60012; }
html[data-theme="white"] .page-wipe .wipe-cover { background: #f4fbff; }

/* ================================================================
