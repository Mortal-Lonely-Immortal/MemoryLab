/* ================================================================
 * DeepTutor — P5 Pentagram UI (r/R=0.45饱满比例, 3层结构)
 * ================================================================ */

const API = '/api';
let userId = 1;
let characterName = 'Phantom';

const DEPTH_LABELS = { basic:'Foundation 基础', medium:'Intermediate 进阶', deep:'Mastery 精通' };
const DEPTH_LABELS_SHORT = { basic:'Basic 基础', medium:'Medium 中级', deep:'Deep 深入' };
const FILE_ICONS = { pdf:'PDF', docx:'DOC', ppt:'PPT', pptx:'PPT' };

let state = {
  learningPrefs: null,
  pomodoroTimer: null, pomodoroSeconds: 0, pomodoroRunning: false,
  pomodoroBaseMinutes: 25, pomodoroMultiplier: 1,
  currentWizardStep: 1,
  wizardData: { cycle_days:30, depth:'medium', hours_per_day:2, need_exercises:1, need_review:1 },
  tutorialTimer: null
};

// ================================================================
// Utility
// ================================================================
async function api(method, url, data, timeoutMs) {
  var opts = { method: method, headers: { 'Content-Type': 'application/json' } };
  if (data) opts.body = JSON.stringify(data);
  var controller = new AbortController();
  var timer = setTimeout(function() { controller.abort(); }, timeoutMs || 15000);
  opts.signal = controller.signal;
  try {
    var r = await fetch(API + url, opts);
    return await r.json();
  } catch (e) {
    if (e && e.name === 'AbortError') throw new Error('请求超时：文档/导师服务没有响应');
    throw e;
  } finally {
    clearTimeout(timer);
  }
}
function $(sel) { return document.querySelector(sel); }
function $$(sel) { return document.querySelectorAll(sel); }

function showToast(message, type) {
  type = type || 'info';
  var border = type === 'success' ? '#4a9' : type === 'error' ? '#c46a6a' : '#3f9d95';
  var toast = document.getElementById('global-toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'global-toast';
    toast.className = 'toast';
    document.body.appendChild(toast);
  }
  toast.style.borderColor = border;
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(function(){ toast.classList.remove('show'); }, 2800);
}

// ================================================================
// Navigation
// ================================================================
$$('.nav-tab').forEach(function(tab) {
  tab.addEventListener('click', function() {
    $$('.nav-tab').forEach(function(t){ t.classList.remove('active'); });
    tab.classList.add('active');
    var page = tab.dataset.page;
    if (location.hash === '#' + page) loadPage(page);
    else location.hash = page;
  });
});

var _pageSeq = 0;
var _pageChain = Promise.resolve();
var _pageHasLoaded = false;
var _wipeFrame = 0;

function prefersReducedMotion() {
  try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; }
}

function captureOldPage() {
  var main = document.getElementById('main-content');
  if (!main) return null;
  var rect = main.getBoundingClientRect();
  var cs = getComputedStyle(main);
  var padL = parseFloat(cs.paddingLeft) || 0;
  var padR = parseFloat(cs.paddingRight) || 0;
  var padT = parseFloat(cs.paddingTop) || 0;

  var layer = document.createElement('div');
  layer.className = 'wipe-old';
  var layerTop = rect.top + padT;
  layer.style.top = layerTop + 'px';
  layer.style.width = '100vw';
  layer.style.height = Math.max(0, window.innerHeight - layerTop) + 'px';

  var inner = document.createElement('div');
  inner.className = 'wipe-old-inner';
  inner.style.left = (rect.left + padL) + 'px';
  inner.style.width = Math.max(0, rect.width - padL - padR) + 'px';
  inner.innerHTML = main.innerHTML;
  inner.querySelectorAll('[id]').forEach(function(el) {
    if (!el.closest('svg')) el.removeAttribute('id');
  });
  layer.appendChild(inner);
  document.body.appendChild(layer);

  // canvas bitmaps are not part of cloneNode, so copy them explicitly
  var srcCanvases = main.querySelectorAll('canvas');
  var dstCanvases = inner.querySelectorAll('canvas');
  for (var i = 0; i < srcCanvases.length && i < dstCanvases.length; i++) {
    try {
      dstCanvases[i].width = srcCanvases[i].width;
      dstCanvases[i].height = srcCanvases[i].height;
      dstCanvases[i].getContext('2d').drawImage(srcCanvases[i], 0, 0);
    } catch (e) {}
  }
  return layer;
}

function makeWipeSlash() {
  var slash = document.createElement('div');
  slash.className = 'wipe-slash';
  slash.setAttribute('aria-hidden', 'true');
  document.body.appendChild(slash);
  return slash;
}

function beginPageWipe() {
  if (!_pageHasLoaded || prefersReducedMotion()) return null;
  // Put the cut on screen first; the old-page snapshot can follow a frame later.
  var slash = makeWipeSlash();
  var oldLayer = captureOldPage();
  if (!oldLayer) {
    if (slash.parentNode) slash.parentNode.removeChild(slash);
    return null;
  }
  return { old: oldLayer, slash: slash };
}

function cleanupPageWipe(ctx) {
  if (!ctx) return;
  if (ctx.old && ctx.old.parentNode) ctx.old.parentNode.removeChild(ctx.old);
  if (ctx.slash && ctx.slash.parentNode) ctx.slash.parentNode.removeChild(ctx.slash);
  try { window.dispatchEvent(new Event('memorylab:wipeend')); } catch (e) {}
}

function endPageWipe(ctx) {
  if (!ctx) return Promise.resolve();
  return new Promise(function(resolve) {
    // Force layout once, then let the compositor move the old page and the
    // cut. This starts on the same click/frame as the skeleton page.
    if (ctx.old) void ctx.old.offsetWidth;
    if (ctx.old) ctx.old.classList.add('is-run');
    if (ctx.slash) ctx.slash.classList.add('is-run');
    setTimeout(function() {
      cleanupPageWipe(ctx);
      resolve();
    }, 600);
  });
}


function loadPage(page) {
  var seq = ++_pageSeq;
  _pageChain = _pageChain.then(async function() {
    if (seq !== _pageSeq) return;
    var wipe = beginPageWipe();
    if (seq !== _pageSeq) { cleanupPageWipe(wipe); return; }
    document.querySelectorAll('.nav-tab').forEach(function(t){ t.classList.toggle('active', t.dataset.page === page); });
    var main = $('#main-content');
    // The old page snapshot covers this skeleton; the old page starts sliding
    // immediately while the real page is still loading behind it.
    if (wipe && main) {
      main.innerHTML = '<div class="p5-card page-loading-card"><div class="p5-card-header">LOADING 加载中</div><div class="page-loading-line"></div></div>';
    }
    var wipeDone = endPageWipe(wipe);
    try {
      if (state.tutorialTimer && state.tutorialTimer.running) await stopTutorialTimer();
      if (typeof teachCleanup === 'function') teachCleanup();
      if (typeof closeCardsArchive === 'function') closeCardsArchive();
      switch (page) {
        case 'review': await renderReview(main); break;
        case 'tutor': await renderTutor(main); break;
        case 'documents': await renderDocuments(main); break;
        case 'teach': await renderTeach(main); break;
        case 'cards': await renderCards(main); break;
        case 'stats': await renderStats(main); break;
        case 'method': await renderMethodLab(main); break;
        case 'settings': await renderSettings(main); break;
      }
      _pageHasLoaded = true;
    } finally {
      await wipeDone;
    }
  }).catch(async function(e) {
    if (seq === _pageSeq) showToast('页面加载失败：' + e.message, 'error');
  });
  return _pageChain;
}

var _weatherData = { code: 0, temp: 22, fetched: false };
var _weatherTimer = null;

function initWeatherBoard() {
  // 不在 WebView2 里触发 geolocation：权限弹窗可能不显示，页面看起来会像卡死。
  _weatherData.fetched = true;
  updateWeatherBoard();
  if (_weatherTimer) clearInterval(_weatherTimer);
  _weatherTimer = setInterval(updateWeatherBoard, 60000);
}

function getPeriod(h) {
  if (h < 6) return { id:'night', text:'深夜', colors:['#0f0f23','#1a1a2e'] };
  if (h < 9) return { id:'morning', text:'早晨', colors:['#e65c00','#ff8c00'] };
  if (h < 12) return { id:'am', text:'上午', colors:['#cc0000','#1a3a8a'] };
  if (h < 14) return { id:'noon', text:'正午', colors:['#3f9d95','#1a5aaa'] };
  if (h < 17) return { id:'pm', text:'午后', colors:['#e67e00','#d4a000'] };
  if (h < 19) return { id:'dusk', text:'放学后', colors:['#e65c00','#cc6600'] };
  return { id:'night', text:'夜晚', colors:['#1a1a2e','#0d1b3e'] };
}

function getWeatherSVG(code) {
  var D = '#000', W = '#fff';
  // 晴天
  if (code === 0) {
    var rays = '';
    for (var i = 0; i < 8; i++) {
      var a = (i * 45 - 90) * Math.PI / 180;
      var r1 = 30, r2 = 40, cx = 40, cy = 40;
      var x1 = cx + r1 * Math.cos(a), y1 = cy + r1 * Math.sin(a);
      var x2 = cx + r2 * Math.cos(a), y2 = cy + r2 * Math.sin(a);
      var perp = (a + Math.PI/2);
      var bw = 5;
      var px1 = x1 + bw * Math.cos(perp), py1 = y1 + bw * Math.sin(perp);
      var px2 = x1 - bw * Math.cos(perp), py2 = y1 - bw * Math.sin(perp);
      rays += '<polygon points="'+px1.toFixed(1)+','+py1.toFixed(1)+' '+px2.toFixed(1)+','+py2.toFixed(1)+' '+x2.toFixed(1)+','+y2.toFixed(1)+'" fill="'+W+'" stroke="'+D+'" stroke-width="2" stroke-linejoin="miter"/>';
    }
    return '<svg viewBox="0 0 80 80">'+rays+'<circle cx="40" cy="40" r="20" fill="'+W+'" stroke="'+D+'" stroke-width="3.5"/></svg>';
  }
  // 多云
  if (code >= 1 && code <= 3) {
    return '<svg viewBox="0 0 80 80">'+
      '<circle cx="50" cy="38" r="18" fill="'+W+'" stroke="'+D+'" stroke-width="3.5"/>'+
      '<circle cx="38" cy="44" r="16" fill="'+W+'" stroke="'+D+'" stroke-width="3.5"/>'+
      '<circle cx="28" cy="38" r="14" fill="'+W+'" stroke="'+D+'" stroke-width="3.5"/>'+
      '<rect x="14" y="38" width="50" height="12" fill="'+W+'"/>'+
      '<line x1="16" y1="50" x2="62" y2="50" stroke="'+D+'" stroke-width="3"/>'+
      '<circle cx="56" cy="34" r="12" fill="'+W+'" stroke="'+D+'" stroke-width="3"/>'+
      '<rect x="44" y="34" width="24" height="12" fill="'+W+'"/>'+
      '<line x1="45" y1="46" x2="67" y2="46" stroke="'+D+'" stroke-width="2.5"/>'+
      '</svg>';
  }
  // 雨天
  if ((code >= 50 && code <= 65) || (code >= 80 && code <= 82) || (code >= 95)) {
    return '<svg viewBox="0 0 80 80">'+
      '<circle cx="48" cy="32" r="16" fill="'+W+'" stroke="'+D+'" stroke-width="3.5"/>'+
      '<circle cx="34" cy="38" r="14" fill="'+W+'" stroke="'+D+'" stroke-width="3.5"/>'+
      '<circle cx="22" cy="34" r="12" fill="'+W+'" stroke="'+D+'" stroke-width="3"/>'+
      '<rect x="10" y="34" width="54" height="10" fill="'+W+'"/>'+
      '<line x1="12" y1="44" x2="63" y2="44" stroke="'+D+'" stroke-width="3"/>'+
      '<line x1="26" y1="52" x2="23" y2="68" stroke="'+D+'" stroke-width="3" stroke-linecap="round"/>'+
      '<line x1="40" y1="52" x2="37" y2="72" stroke="'+D+'" stroke-width="3" stroke-linecap="round"/>'+
      '<line x1="54" y1="52" x2="51" y2="68" stroke="'+D+'" stroke-width="3" stroke-linecap="round"/>'+
      '</svg>';
  }
  // 雪天
  if (code >= 70 && code <= 77) {
    var sf = '';
    for (var i = 0; i < 3; i++) {
      var sx = 22 + i * 16, sy = 56 + (i%2)*6;
      sf += '<g transform="translate('+sx+','+sy+')">'+
        '<line x1="0" y1="-6" x2="0" y2="6" stroke="'+D+'" stroke-width="2.5"/>'+
        '<line x1="-5" y1="-3" x2="5" y2="3" stroke="'+D+'" stroke-width="2.5"/>'+
        '<line x1="5" y1="-3" x2="-5" y2="3" stroke="'+D+'" stroke-width="2.5"/>'+
        '</g>';
    }
    return '<svg viewBox="0 0 80 80">'+
      '<circle cx="48" cy="30" r="16" fill="'+W+'" stroke="'+D+'" stroke-width="3.5"/>'+
      '<circle cx="34" cy="36" r="14" fill="'+W+'" stroke="'+D+'" stroke-width="3.5"/>'+
      '<circle cx="22" cy="32" r="12" fill="'+W+'" stroke="'+D+'" stroke-width="3"/>'+
      '<rect x="10" y="32" width="54" height="10" fill="'+W+'"/>'+
      '<line x1="12" y1="42" x2="63" y2="42" stroke="'+D+'" stroke-width="3"/>'+
      sf+'</svg>';
  }
  // 默认晴天
  return getWeatherSVG(0);
}

function fetchWeather() {
  if (!navigator.geolocation) { _weatherData.fetched = true; return; }
  navigator.geolocation.getCurrentPosition(function(pos) {
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + pos.coords.latitude.toFixed(2) +
      '&longitude=' + pos.coords.longitude.toFixed(2) + '&current_weather=true';
    fetch(url).then(function(r){ return r.json(); }).then(function(d){
      if (d && d.current_weather) {
        _weatherData.code = d.current_weather.weathercode || 0;
        _weatherData.temp = Math.round(d.current_weather.temperature) || 22;
        _weatherData.fetched = true;
        updateWeatherBoard();
      }
    }).catch(function(){ _weatherData.fetched = true; });
  }, function(){ _weatherData.fetched = true; });
}

function updateWeatherBoard() {
  var now = new Date();
  var day = now.getDate();
  var hrs = now.getHours();
  var dow = now.getDay();

  var EN_DAYS = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
  var CN_DAYS = ['日','一','二','三','四','五','六'];
  var period = getPeriod(hrs);
  var fullEn = EN_DAYS[dow];
  var dayIdx = fullEn.indexOf('DAY');
  var enL = dayIdx > 0 ? fullEn.slice(0, dayIdx) : fullEn.slice(0, Math.floor(fullEn.length / 2));
  var enR = dayIdx > 0 ? fullEn.slice(dayIdx) : fullEn.slice(Math.floor(fullEn.length / 2));

  var numEl = document.getElementById('ptc-num');
  if (numEl) numEl.textContent = String(day).padStart(2, '0');

  var weekL = document.getElementById('ptc-week-l');
  if (weekL) weekL.textContent = enL;

  var weekR = document.getElementById('ptc-week-r');
  if (weekR) weekR.textContent = enR;

  var diaCn = document.getElementById('ptc-dia-cn');
  if (diaCn) diaCn.textContent = CN_DAYS[dow];

  var periodEl = document.getElementById('ptc-period');
  if (periodEl) periodEl.textContent = period.text;

  var weatherEl = document.getElementById('ptc-wx');
  if (weatherEl && _weatherData.fetched) {
    weatherEl.innerHTML = getWeatherSVG(_weatherData.code);
  }
}

async function uploadDocument() {
  var fileInput = $('#doc-file'); var file = fileInput.files[0];
  if (!file) { showToast('Select a file 请选择文件', 'error'); return; }
  var formData = new FormData(); formData.append('file', file); formData.append('user_id', userId);
  var pd = $('#upload-progress'), pb = $('#upload-progress-bar'), pp = $('#upload-progress-pct');
  var pt = $('#upload-progress-text'), se = $('#upload-status'); se.textContent = '';
  var data;
  try {
    data = await new Promise(function(resolve, reject) {
      var xhr = new XMLHttpRequest(); xhr.open('POST', API + '/documents/upload');
      xhr.upload.addEventListener('progress', function(e) {
        if (e.lengthComputable) {
          var pct = Math.round(e.loaded / e.total * 100);
          pd.style.display = 'block'; pb.style.width = pct + '%'; pp.textContent = pct + '%';
          pt.textContent = 'Uploading ' + (e.loaded/1024/1024).toFixed(1) + ' / ' + (e.total/1024/1024).toFixed(1) + ' MB';
        }
      });
      xhr.addEventListener('load', function() { try { resolve(JSON.parse(xhr.responseText)); } catch(e) { reject(new Error('Invalid')); } });
      xhr.addEventListener('error', function() { reject(new Error('Failed')); });
      xhr.send(formData);
    });
  } catch(e) { pd.style.display = 'none'; se.textContent = 'UPLOAD FAILED 上传失败'; return; }
  setTimeout(function(){ pd.style.display = 'none'; }, 800);
  se.textContent = data.status === 'ok' ? 'UPLOADED 已上传: ' + (data.original_name || data.filename) : 'ERROR 错误: ' + data.error;
  if (data.status === 'ok') renderDocuments($('#main-content'));
}

const MEM = '/api/v1';
let reviewState = { queue: [], idx: 0, revealed: false, startedAt: 0 };
let cardsState = { page: 1, total: 0, size: 20, q: '', deckId: '', state: '', records: [], decks: [] };

function escapeHtml(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

async function memApi(method, url, data, timeoutMs) {
  var opts = { method: method, headers: { 'Content-Type': 'application/json' } };
  if (data) opts.body = JSON.stringify(data);
  var controller = new AbortController();
  var timer = setTimeout(function() { controller.abort(); }, timeoutMs || 15000);
  opts.signal = controller.signal;
  try {
    var response = await fetch(MEM + url, opts);
    var body = await response.json().catch(function() { return { code: response.status, message: '请求失败' }; });
    if (!response.ok || body.code !== 0) throw new Error(body.message || ('HTTP ' + response.status));
    return body.data;
  } catch (e) {
    if (e && e.name === 'AbortError') throw new Error('请求超时：本地记忆服务没有响应');
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

function stateName(state) {
  return state === 0 ? '新卡' : state === 1 ? '学习中' : state === 2 ? '复习' : '重学';
}

async function rateReview(rating) {
  var item = reviewState.queue[reviewState.idx];
  if (!item) return;
  var buttons = document.querySelectorAll('.rating-btn');
  buttons.forEach(function(b) { b.disabled = true; b.style.opacity = '0.5'; });
  try {
    await memApi('POST', '/review/' + item.card.id, {
      rating: rating,
      durationMs: Math.max(1, Date.now() - reviewState.startedAt),
      clientReqId: 'p5-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8)
    });
    awardPersona('knowledge', 2);
    if (rating <= 2) awardPersona('guts', 1);
    try {
      var todayKey = new Date().toLocaleDateString();
      if (localStorage.getItem('memoryLabPersonaReviewDay') !== todayKey) {
        awardPersona('guts', 2);
        localStorage.setItem('memoryLabPersonaReviewDay', todayKey);
      }
    } catch (e) {}
    reviewState.idx++;
    reviewState.revealed = false;
    reviewState.startedAt = Date.now();
    drawReviewCard();
  } catch (e) {
    showToast(e.message, 'error');
    buttons.forEach(function(b) { b.disabled = false; b.style.opacity = '1'; });
  }
}

async function deleteReviewCard() {
  var item = reviewState.queue[reviewState.idx];
  if (!item) return;
  if (!window.confirm('删除这张卡？\n\n#' + item.card.id + '  ' + item.card.front.slice(0, 80) + '\n\n删除后本轮会直接跳到下一张。')) return;
  var btn = document.getElementById('review-delete-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'DELETING...'; }
  try {
    await memApi('DELETE', '/cards/' + item.card.id);
    cardsState.records = (cardsState.records || []).filter(function(c) { return c.id !== item.card.id; });
    reviewState.queue.splice(reviewState.idx, 1);
    reviewState.revealed = false;
    reviewState.startedAt = Date.now();
    showToast('已删除卡片 #' + item.card.id, 'info');
    drawReviewCard();
  } catch (e) {
    showToast(e.message, 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'DELETE 删除本卡'; }
  }
}

async function loadCards(page) {
  if (page < 1) page = 1;
  cardsState.page = page;
  var params = '?page=' + page + '&size=' + cardsState.size;
  if (cardsState.q) params += '&keyword=' + encodeURIComponent(cardsState.q);
  if (cardsState.deckId) params += '&deckId=' + encodeURIComponent(cardsState.deckId);
  if (cardsState.state !== '') params += '&state=' + encodeURIComponent(cardsState.state);
  var data = await memApi('GET', '/cards' + params);
  cardsState.total = data.total || 0;
  cardsState.records = data.records || [];
  var list = $('#cards-list');
  if (!data.records || data.records.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">C</div><h3>NO CARDS 没有卡片</h3></div>';
  } else {
    list.innerHTML = data.records.map(function(c) {
      return '<div class="card-row rhine-card" data-card-id="' + c.id + '">' +
        '<div class="front"><span class="rhine-index">X-' + String(c.id).padStart(3, '0') + '</span>' + escapeHtml(c.front) +
        '<div class="card-back">' + escapeHtml(c.back || '') + '</div>' +
        '<div class="card-extra">' + escapeHtml(c.extra || '') + '</div>' +
        '<div class="rhine-hint">CLICK TO REVEAL · 点击翻开</div></div>' +
        '<div class="meta">' + (c.suspended ? '暂停' : stateName(c.state)) + '<br>#' + c.id +
        '<div class="card-reps">' + (c.reps || 0) + ' 复习 / ' + (c.lapses || 0) + ' 遗忘</div></div>' +
        '<div class="card-actions"><button class="btn btn-sm" onclick="openCardModal(' + c.id + ')">EDIT</button>' +
        '<button class="btn btn-sm" onclick="toggleCardSuspend(' + c.id + ',' + (!!c.suspended) + ')">' + (c.suspended ? '恢复' : '暂停') + '</button>' +
        '<button class="btn btn-sm btn-danger" onclick="deleteCard(' + c.id + ')">删除</button></div></div>';
    }).join('');
    if (typeof bindRhineCards === 'function') bindRhineCards(list);
  }
  var pages = Math.max(1, Math.ceil(cardsState.total / cardsState.size));
  $('#cards-page-label').textContent = cardsState.page + ' / ' + pages + ' · ' + cardsState.total + ' cards';
  $('#cards-prev').disabled = cardsState.page <= 1;
  $('#cards-next').disabled = cardsState.page >= pages;
}

function showCardsList() {
  if (window.Archive3D) { try { window.Archive3D.close(); } catch (e) {} }
  var archive = $('#cards-archive');
  var list = $('#cards-list');
  var pager = $('#cards-pager');
  var toolbar = $('.cards-toolbar');
  if (archive) { archive.classList.remove('is-on'); archive.innerHTML = ''; }
  if (list) list.style.display = '';
  if (pager) pager.style.display = '';
  if (toolbar) toolbar.style.display = '';
}

function closeCardsArchive() { showCardsList(); }

async function openArchive3D() {
  if (!window.Archive3D) { showToast('3D 模块还在加载，请稍后重试', 'info'); return; }
  if (window.__archive3dPreload) { try { await window.__archive3dPreload; } catch (e) {} }
  var archive = $('#cards-archive');
  var list = $('#cards-list');
  var pager = $('#cards-pager');
  var toolbar = $('.cards-toolbar');
  if (!archive) return;
  var cards = cardsState.records || [];
  try {
    var data = await memApi('GET', '/cards?page=1&size=2000', null, 30000);
    if (data && data.records && data.records.length) cards = data.records;
  } catch (e) {}
  if (!cards.length) { showToast('没有可展示的卡片', 'error'); return; }
  if (list) list.style.display = 'none';
  if (pager) pager.style.display = 'none';
  if (toolbar) toolbar.style.display = 'none';
  archive.classList.add('is-on');
  window.Archive3D.open({
    container: archive,
    cards: cards,
    decks: cardsState.decks || [],
    onClose: function () {
      archive.classList.remove('is-on');
      archive.innerHTML = '';
      if (list) list.style.display = '';
      if (pager) pager.style.display = '';
      if (toolbar) toolbar.style.display = '';
    }
  });
}

function closeCardModal() {
  var o = $('#card-modal-overlay'); var m = $('#card-modal');
  if (o) o.remove(); if (m) m.remove();
}

function openCardModal(id) {
  var card = id ? (cardsState.records || []).filter(function(c) { return c.id === id; })[0] : null;
  var decks = cardsState.decks || [];
  var deckOptions = decks.map(function(d) {
    return '<option value="' + d.id + '"' + (card && card.deckId === d.id ? ' selected' : '') + '>' + escapeHtml(d.name) + '</option>';
  }).join('');
  var html = '<div class="modal-overlay" id="card-modal-overlay" style="display:block;" onclick="closeCardModal()"></div>' +
    '<div class="p5-modal" id="card-modal" style="display:block;max-width:620px;">' +
      '<div class="p5-card-header" style="display:flex;justify-content:space-between;align-items:center;padding:18px 18px 0;"><span>' + (card ? 'EDIT CARD 编辑卡片' : 'NEW CARD 新建卡片') + '</span><button class="btn btn-sm" onclick="closeCardModal()">X</button></div>' +
      '<div class="card-form">' +
        '<div class="card-form-row"><label>卡组<select id="cf-deck">' + deckOptions + '</select></label><label>类型<select id="cf-type"><option value="QA">问答 QA</option><option value="CLOZE">填空 CLOZE</option><option value="WHY">追问 WHY</option><option value="MCQ">选择 MCQ</option></select></label></div>' +
        '<label>问题<textarea id="cf-front" rows="3">' + (card ? escapeHtml(card.front) : '') + '</textarea></label>' +
        '<label>答案<textarea id="cf-back" rows="3">' + (card ? escapeHtml(card.back) : '') + '</textarea></label>' +
        '<label>备注<input id="cf-extra" value="' + (card ? escapeHtml(card.extra || '') : '') + '"></label>' +
        '<div class="card-form-actions"><button class="btn btn-sm" onclick="closeCardModal()">CANCEL 取消</button><button class="btn btn-sm btn-primary" onclick="saveCard(' + (card ? card.id : 'null') + ')">SAVE 保存</button></div>' +
      '</div>' +
    '</div>';
  document.body.insertAdjacentHTML('beforeend', html);
  if (card) $('#cf-type').value = card.cardType || 'QA';
}

async function saveCard(id) {
  var deckId = Number($('#cf-deck').value);
  var front = $('#cf-front').value.trim();
  var back = $('#cf-back').value.trim();
  if (!deckId || !front || !back) { showToast('卡组、问题和答案不能为空', 'error'); return; }
  var payload = { deckId: deckId, cardType: $('#cf-type').value, front: front, back: back, extra: $('#cf-extra').value.trim() };
  try {
    if (id) await memApi('PUT', '/cards/' + id, payload);
    else await memApi('POST', '/cards', payload);
    closeCardModal();
    showToast('卡片已保存', 'success');
    await loadCards(cardsState.page);
  } catch (e) { showToast(e.message, 'error'); }
}

async function toggleCardSuspend(id, suspended) {
  try {
    await memApi('POST', '/cards/' + id + '/suspend?suspend=' + (!suspended));
    await loadCards(cardsState.page);
  } catch (e) { showToast(e.message, 'error'); }
}

async function deleteCard(id) {
  if (!confirm('删除这张卡片？')) return;
  try {
    await memApi('DELETE', '/cards/' + id);
    showToast('卡片已删除', 'success');
    await loadCards(cardsState.page);
  } catch (e) { showToast(e.message, 'error'); }
}

var _lastStatsData = null;
var statsChart = null;
var heatChart = null;
var forecastChart = null;
var stateChart = null;

function statsTheme() {
  var white = document.documentElement.getAttribute('data-theme') === 'white';
  return {
    white: white,
    text: white ? '#3d4a66' : '#f7f4ee',
    axis: white ? '#8fb8d0' : '#f7f4ee',
    grid: white ? '#c9e2ef' : '#2a2a2a',
    accent: white ? '#1b57ff' : '#e60012',
    blue: white ? '#35d1e8' : '#d6ff4a',
    heat: white ? ['#eaf4fb', '#b9e3f4', '#35d1e8', '#1b57ff', '#f0417f'] : ['#0c0c0c', '#3a0000', '#7a0000', '#c00000', '#ff3347']
  };
}

function disposeChart(chart) {
  try { if (chart) chart.dispose(); } catch (e) {}
  return null;
}

function redrawStatsCharts() {
  if (!_lastStatsData || !$('#stats-chart')) return;
  var charts = [
    function() { drawStatsChart(_lastStatsData.daily); },
    function() { drawHeatmap(_lastStatsData.heat); },
    function() { drawForecast(_lastStatsData.forecast); },
    function() { drawStateChart(_lastStatsData.states); }
  ];
  var idx = 0;
  function next() {
    if (idx >= charts.length || !_lastStatsData || !$('#stats-chart')) return;
    charts[idx++]();
    if (idx < charts.length) requestAnimationFrame(function() { setTimeout(next, 0); });
  }
  // Do not initialize four ECharts instances in one long task, and do not do
  // it while the wipe is moving. Spread them over consecutive frames.
  if (document.querySelector('.wipe-old')) {
    window.addEventListener('memorylab:wipeend', function() {
      setTimeout(function() { requestAnimationFrame(next); }, 30);
    }, { once: true });
    return;
  }
  next();
}

function drawStatsChart(daily) {
  if (!window.echarts) return;
  var el = $('#stats-chart');
  if (!el) return;
  var t = statsTheme();
  statsChart = disposeChart(statsChart);
  statsChart = window.echarts.init(el, null, { renderer: 'canvas' });
  var dates = daily.map(function(d) { return d.date.slice(5); });
  var news = daily.map(function(d) { return d.newCount; });
  var reviews = daily.map(function(d) { return d.reviewCount; });
  var retention = daily.map(function(d) { return d.reviewCount > 0 ? Math.round(d.retention * 100) : null; });
  statsChart.setOption({
    animation: false,
    backgroundColor: 'transparent',
    textStyle: { color: t.text, fontFamily: 'Microsoft YaHei' },
    grid: { left: 42, right: 46, top: 38, bottom: 40 },
    tooltip: { trigger: 'axis' },
    legend: { data: ['NEW 新学', 'REVIEW 复习', 'RETENTION 保持率'], textStyle: { color: t.text }, top: 0, itemWidth: 12, itemHeight: 8 },
    xAxis: { type: 'category', data: dates, axisLine: { lineStyle: { color: t.axis } }, axisLabel: { color: t.text, fontSize: 10 } },
    yAxis: [
      { type: 'value', splitLine: { lineStyle: { color: t.grid } }, axisLabel: { color: t.text } },
      { type: 'value', min: 0, max: 100, splitLine: { show: false }, axisLabel: { color: t.text, formatter: '{value}%' } }
    ],
    series: [
      { name: 'NEW 新学', type: 'bar', data: news, itemStyle: { color: t.accent }, barMaxWidth: 12 },
      { name: 'REVIEW 复习', type: 'bar', data: reviews, itemStyle: { color: t.blue }, barMaxWidth: 12 },
      { name: 'RETENTION 保持率', type: 'line', yAxisIndex: 1, data: retention, connectNulls: false, symbolSize: 4, lineStyle: { color: t.accent, width: 2 }, itemStyle: { color: t.accent } }
    ]
  });
}

function drawHeatmap(heat) {
  if (!window.echarts) return;
  var el = $('#heat-chart');
  if (!el) return;
  var t = statsTheme();
  heatChart = disposeChart(heatChart);
  heatChart = window.echarts.init(el, null, { renderer: 'canvas' });
  var end = new Date();
  var start = new Date(end);
  start.setDate(end.getDate() - 364);
  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  var counts = (heat || []).map(function(x) { return x.count; });
  var max = Math.max(2, Math.max.apply(null, counts.length ? counts : [0]));
  try {
    heatChart.setOption({
    animation: false,
      backgroundColor: 'transparent',
      textStyle: { color: t.text, fontFamily: 'Microsoft YaHei' },
      tooltip: { formatter: function(p) { return p.value[0] + '<br/>复习 ' + p.value[1] + ' 张'; } },
      visualMap: { show: false, min: 0, max: max, inRange: { color: t.heat } },
      calendar: {
        range: [iso(start), iso(end)],
        left: 40, right: 16, top: 24, bottom: 28,
        cellSize: ['auto', 12],
        splitLine: { show: false },
        itemStyle: { color: t.white ? '#f4fbfe' : '#1b1b1b', borderColor: t.white ? '#ffffff' : '#0c0c0c', borderWidth: 2 },
        yearLabel: { show: false },
        dayLabel: { firstDay: 1, nameMap: 'ZH', color: t.text, fontSize: 10 },
        monthLabel: { nameMap: 'ZH', color: t.text, fontSize: 10 }
      },
      series: [{ type: 'heatmap', coordinateSystem: 'calendar', data: (heat || []).map(function(x) { return [x.date, x.count]; }) }]
    });
  } catch (e) {
    el.innerHTML = '<div class="error-state">热力图加载失败</div>';
  }
}

function drawForecast(forecast) {
  if (!window.echarts) return;

  if (!el) return;
  var t = statsTheme();
  forecastChart = disposeChart(forecastChart);

  forecastChart.setOption({

    backgroundColor: 'transparent',
    textStyle: { color: t.text, fontFamily: 'Microsoft YaHei' },

    yAxis: { type: 'value', minInterval: 1, splitLine: { lineStyle: { color: t.grid } }, axisLabel: { color: t.text } },

function drawStateChart(states) {
  if (!window.echarts) return;
  var el = $('#state-chart');
  if (!el) return;
  var t = statsTheme();
  stateChart = disposeChart(stateChart);
  stateChart = window.echarts.init(el, null, { renderer: 'canvas' });

    }]
  });

function resizeStatsCharts() {
  [statsChart, heatChart, forecastChart, stateChart].forEach(function(c) { try { if (c) c.resize(); } catch (e) {} });
}

// Method Lab — 每周 3–5 个学习方法 + 每日评分 + 复盘
// ================================================================
var methodState = { plan: null, methods: [], week: [], saving: false };
var methodChart = null;

function methodIso(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function methodWeekStart() {
  var d = new Date();
  var day = d.getDay();
  var diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return methodIso(d);
}
function methodWeekDays(start) {
  var base = new Date(start + 'T00:00:00');
  var names = ['一', '二', '三', '四', '五', '六', '日'];
  var today = methodIso(new Date());
  var out = [];
  for (var i = 0; i < 7; i++) {
    var d = new Date(base);
    d.setDate(base.getDate() + i);
    var iso = methodIso(d);
    out.push({ iso: iso, name: names[i], isToday: iso === today });
  }
  return out;
}
function methodScoreOf(item, date) {
  var logs = item.logs || [];
  for (var i = 0; i < logs.length; i++) if (logs[i].date === date) return logs[i].score;
  return 0;
}
function methodSuggest(avg) {
  if (avg == null) return 'TRIAL';
  if (avg >= 3.5) return 'KEEP';
  if (avg <= 2.5) return 'DROP';
  return 'TRIAL';
}
function methodDecisionText(d) {
  return d === 'KEEP' ? '保留' : d === 'DROP' ? '淘汰' : d === 'TRIAL' ? '再试' : '';
}

var PERSONA_DIMS = [
  { name: '知识', key: 'knowledge' },
  { name: '胆量', key: 'guts' },
  { name: '灵巧', key: 'dexterity' },
  { name: '温柔', key: 'kindness' },
  { name: '魅力', key: 'charm' }
];
// Velvet: 初始 Lv.1 / 0 点；Lv.2–5 累计阈值 40 / 200 / 350 / 500
var PERSONA_THRESHOLDS = [0, 40, 200, 350, 500];
var PERSONA_VIEW_KEY = 'memoryLabPersonaView';
var PERSONA_POINTS_KEY = 'memoryLabPersonaPoints';
var PERSONA_TITLES = {
  knowledge: ['蒙昧初开', '略有所知', '渐入学理', '博闻强识', '真知灼见'],
  guts: ['畏首畏尾', '勉强应战', '临危不乱', '勇往直前', '无畏之心'],
  dexterity: ['手忙脚乱', '稍具准头', '心手相应', '巧思灵动', '精准无误'],
  kindness: ['冷眼旁观', '懂得体谅', '温言相待', '暖意渐深', '慈心如灯'],
  charm: ['平平无奇', '略有好感', '引人注目', '风度初成', '光彩照人']
};
var PENTA = {
  cx: 350, cy: 355,
  baseR: 280, refR: 210,
  r1: 52.5, innerRatio: 0.45,
  decorations: ['mask', 'fist', 'compass', 'envelope', 'lips']
};

function personaPoints() {
  try {
    var raw = JSON.parse(localStorage.getItem(PERSONA_POINTS_KEY) || 'null');
    if (raw && typeof raw === 'object') {
      var out = {};
      PERSONA_DIMS.forEach(function(d) {
        out[d.key] = Math.max(0, Math.min(500, Number(raw[d.key]) || 0));
      });
      return out;
    }
  } catch (e) {}
  var zero = {};
  PERSONA_DIMS.forEach(function(d) { zero[d.key] = 0; });
  return zero;
}
function savePersonaPoints(points) {
  try { localStorage.setItem(PERSONA_POINTS_KEY, JSON.stringify(points)); } catch (e) {}
}
function personaLevelInfo(id) {
  var points = personaPoints()[id] || 0;
  var level = 1;
  while (level < 5 && points >= PERSONA_THRESHOLDS[level]) level++;
  var base = PERSONA_THRESHOLDS[level - 1];
  var next = level < 5 ? PERSONA_THRESHOLDS[level] : null;
  var progress = next ? Math.max(0, Math.min(1, (points - base) / (next - base))) : 1;
  return {
    id: id, points: points, level: level,
    levelFloat: level + (next ? progress : 0),
    base: base, next: next, progress: progress,
    title: PERSONA_TITLES[id][level - 1],
    max: level >= 5
  };
}
function awardPersona(id, amount) {
  if (!PERSONA_TITLES[id]) return;
  var points = personaPoints();
  points[id] = Math.max(0, Math.min(500, (points[id] || 0) + amount));
  savePersonaPoints(points);
  if ($('#persona-chart')) initPersona();
}
function personaView() {
  try { return localStorage.getItem(PERSONA_VIEW_KEY) === 'radar' ? 'radar' : 'star'; }
  catch (e) { return 'star'; }
}
function setPersonaView(view) {
  try { localStorage.setItem(PERSONA_VIEW_KEY, view === 'radar' ? 'radar' : 'star'); } catch (e) {}
  initPersona();
}
function initPersona() {
  var tabs = $('#persona-viewtabs');
  var stats = $('#persona-stats');
  if (!stats) return;
  if (tabs) {
    var starTab = document.documentElement.getAttribute('data-theme') === 'white' ? 'STAR 蓝星' : 'STAR 黄星';
    tabs.innerHTML = '<button class="persona-viewtab' + (personaView() === 'star' ? ' active' : '') + '" onclick="setPersonaView(\'star\')">' + starTab + '</button>' +
      '<button class="persona-viewtab' + (personaView() === 'radar' ? ' active' : '') + '" onclick="setPersonaView(\'radar\')">RADAR 雷达</button>';
  }
  stats.innerHTML = PERSONA_DIMS.map(function(d) {
    var info = personaLevelInfo(d.key);
    var pct = info.max ? 100 : Math.round(info.progress * 100);
    var nextText = info.max ? 'MAX · ' + info.title : info.points + ' / ' + info.next + ' 点 · ' + info.title;
    return '<div class="persona-stat"><div class="ps-head"><span>' + d.name + '</span><b>' + (info.max ? 'MAX' : 'Lv.' + info.level) + '</b></div>' +
      '<div class="ps-bar"><i style="width:' + pct + '%"></i></div><div class="ps-note">' + nextText + '</div></div>';
  }).join('');
  drawPersona();
}
function drawPersona() {
  var svg = $('#persona-chart');
  if (!svg) return;
  if (personaView() === 'radar') drawPersonaRadar(svg);
  else drawPersonaStar(svg);
}
function drawPersonaRadar(svg) {
  var white = document.documentElement.getAttribute('data-theme') === 'white';
  var gridColor = white ? '#b9d6e7' : '#333333';
  var labelColor = white ? '#0a1230' : '#ffffff';
  var valueColor = white ? '#1b57ff' : '#ffcc00';
  var polyFill = white ? 'rgba(27,87,255,0.16)' : 'rgba(255,204,0,0.18)';
  var polyStroke = white ? '#1b57ff' : '#ffcc00';
  var cx = 210, cy = 210, R = 122, labelR = 166;
  function pt(i, r) {
    var a = (-90 + i * 72) * Math.PI / 180;
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  }
  function poly(r) {
    var pts = [];
    for (var i = 0; i < 5; i++) { var p = pt(i, r); pts.push(p[0].toFixed(1) + ',' + p[1].toFixed(1)); }
    return pts.join(' ');
  }
  var html = '';
  [0.2, 0.4, 0.6, 0.8, 1].forEach(function(k) {
    html += '<polygon points="' + poly(R * k) + '" fill="none" stroke="' + gridColor + '" stroke-width="1"/>';
  });
  for (var i = 0; i < 5; i++) {
    var e = pt(i, R);
    html += '<line x1="' + cx + '" y1="' + cy + '" x2="' + e[0].toFixed(1) + '" y2="' + e[1].toFixed(1) + '" stroke="' + gridColor + '" stroke-width="1"/>';
  }
  var vp = [];
  var levels = [];
  for (var j = 0; j < 5; j++) {
    var info = personaLevelInfo(PERSONA_DIMS[j].key);
    levels.push(info);
    var p = pt(j, Math.max(10, R * info.levelFloat / 5));
    vp.push(p[0].toFixed(1) + ',' + p[1].toFixed(1));
  }
  html += '<polygon points="' + vp.join(' ') + '" fill="' + polyFill + '" stroke="' + polyStroke + '" stroke-width="2"/>';
  for (var k = 0; k < 5; k++) {
    var q = pt(k, Math.max(10, R * levels[k].levelFloat / 5));
    html += '<circle cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="4" fill="' + polyStroke + '"/>';
    var l = pt(k, labelR);
    var anchor = l[0] < cx - 8 ? 'end' : l[0] > cx + 8 ? 'start' : 'middle';
    html += '<text x="' + l[0].toFixed(1) + '" y="' + (l[1] - 4).toFixed(1) + '" text-anchor="' + anchor + '" fill="' + labelColor + '" font-size="12" font-weight="700">' + PERSONA_DIMS[k].name + '</text>';
    html += '<text x="' + l[0].toFixed(1) + '" y="' + (l[1] + 12).toFixed(1) + '" text-anchor="' + anchor + '" fill="' + valueColor + '" font-size="11" font-family="Courier New">' + levels[k].title + '</text>';
  }
  var labels = $('#persona-star-labels');
  if (labels) labels.innerHTML = '';
  svg.setAttribute('viewBox', '0 0 420 420');
  svg.innerHTML = html;
}

// 原 DeepTutor 的 P5 黄星：暗基底 + 5 层刻度 + 金色分面数值星 + 顶点装饰 + 黄底标签
function drawPersonaStar(svg) {
  var white = document.documentElement.getAttribute('data-theme') === 'white';
  var C = white ? {
    base: '#eaf4fb', ring: '#b9d6e7', dot: '#1b57ff',
    guide: 'rgba(27,87,255,0.22)', deco: '#3d6aa8',
    midDot: '#8fb8d0', midOpacity: '0.5'
  } : {
    base: '#333333', ring: '#1a1a1a', dot: '#ffffff',
    guide: 'rgba(26,26,26,0.45)', deco: '#666666',
    midDot: '#333333', midOpacity: '0.45'
  };
  var cx = PENTA.cx, cy = PENTA.cy, bR = PENTA.baseR, rR = PENTA.refR;
  var r1 = PENTA.r1, r5 = PENTA.refR, rStep = (r5 - r1) / 4;
  var infos = PERSONA_DIMS.map(function(d) { return personaLevelInfo(d.key); });
  var levels = infos.map(function(i) { return i.levelFloat; });

  function calcVertices(outerR) {
    var innerR = outerR * PENTA.innerRatio;
    var out = [];
    for (var i = 0; i < 5; i++) {
      var oa = (-90 + i * 72) * Math.PI / 180;
      var ia = (-90 + 36 + i * 72) * Math.PI / 180;
      out.push({
        ox: cx + outerR * Math.cos(oa), oy: cy + outerR * Math.sin(oa),
        ix: cx + innerR * Math.cos(ia), iy: cy + innerR * Math.sin(ia)
      });
    }
    return out;
  }
  function levelRadius(lv) { return r1 + (Math.max(1, Math.min(5, lv)) - 1) * (r5 - r1) / 4; }
  function valueStarVertices(maxR, lvls) {
    var innerR = maxR * PENTA.innerRatio;
    var pts = [];
    for (var i = 0; i < 5; i++) {
      var targetR = levelRadius(lvls[i]);
      var ratio = targetR / maxR;
      var oa = (-90 + i * 72) * Math.PI / 180;
      var ia = (-90 + 36 + i * 72) * Math.PI / 180;
      pts.push({ x: cx + maxR * Math.cos(oa) * ratio, y: cy + maxR * Math.sin(oa) * ratio });
      pts.push({ x: cx + innerR * Math.cos(ia) * ratio, y: cy + innerR * Math.sin(ia) * ratio });
    }
    return pts;
  }
  function verticesPath(verts) {
    var pts = [];
    for (var i = 0; i < 5; i++) {
      pts.push(verts[i].ox.toFixed(2) + ',' + verts[i].oy.toFixed(2));
      pts.push(verts[i].ix.toFixed(2) + ',' + verts[i].iy.toFixed(2));
    }
    return 'M' + pts.join('L') + 'Z';
  }
  function pointsPath(pts) {
    return 'M' + pts.map(function(p) { return p.x.toFixed(2) + ',' + p.y.toFixed(2); }).join('L') + 'Z';
  }

  var baseVerts = calcVertices(bR);
  var refVerts = calcVertices(rR);
  var valStar = valueStarVertices(rR, levels);
  var D = C.deco;
  var svgHtml = '<svg viewBox="0 0 700 700" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">';
  svgHtml += '<defs>';
  svgHtml += white
    ? '<radialGradient id="psGrad" cx="50%" cy="50%" r="55%"><stop offset="0%" stop-color="#8fc4ff"/><stop offset="25%" stop-color="#3b82f6"/><stop offset="55%" stop-color="#1b57ff"/><stop offset="80%" stop-color="#0a3bd6"/><stop offset="100%" stop-color="#082a9e"/></radialGradient>'
    : '<radialGradient id="psGrad" cx="50%" cy="50%" r="55%"><stop offset="0%" stop-color="#FFE042"/><stop offset="30%" stop-color="#FFD633"/><stop offset="60%" stop-color="#F5B800"/><stop offset="85%" stop-color="#E69F00"/><stop offset="100%" stop-color="#D48800"/></radialGradient>';
  svgHtml += white
    ? '<radialGradient id="psDark" cx="50%" cy="50%" r="55%"><stop offset="0%" stop-color="#1b57ff"/><stop offset="45%" stop-color="#0a3bd6"/><stop offset="100%" stop-color="#08247a"/></radialGradient>'
    : '<radialGradient id="psDark" cx="50%" cy="50%" r="55%"><stop offset="0%" stop-color="#FFD633"/><stop offset="35%" stop-color="#EEB800"/><stop offset="65%" stop-color="#D99800"/><stop offset="100%" stop-color="#C07800"/></radialGradient>';
  svgHtml += white

var _tutorOverlay = null;

function openTutorOverlay() {
  if (_tutorOverlay) { _tutorOverlay.style.display = 'flex'; return; }
  var el = document.createElement('div');
  el.className = 'tutor-overlay';
  el.id = 'tutor-overlay';
  el.innerHTML = '<div class="to-head"><div><span class="to-title">AI TUTOR</span><span class="to-sub">导师浮窗</span></div><button class="to-close" title="关闭">X</button></div>' +
    '<div class="to-log" id="to-log"><div class="to-msg sys">加载历史…</div></div>' +
    '<div class="to-input"><input id="to-input" placeholder="问点什么…" autocomplete="off"><button class="to-send" id="to-send">发送</button></div>' +
    '<div class="to-hint">WebView2 不支持系统置顶，已切到应用内浮窗：可拖动标题栏、拖右下角调大小。</div>' +
    '<div class="to-resize">↘</div>';
  document.body.appendChild(el);
  _tutorOverlay = el;

  var log = $('#to-log');
  var input = $('#to-input');
  var close = el.querySelector('.to-close');
  function add(role, text) {
    var m = document.createElement('div');
    m.className = 'to-msg ' + role;
    m.textContent = text;
    log.appendChild(m);
    log.scrollTop = log.scrollHeight;
  }
  async function load() {
    try {
      var history = await api('GET', '/tutor/history?user_id=' + userId, null, 15000);
      log.innerHTML = '';
      if (!history || !history.length) add('sys', '开始对话吧');
      (history || []).forEach(function(h) { add(h.role === 'user' ? 'user' : 'assistant', h.content); });
    } catch (e) { log.innerHTML = ''; add('sys', '历史加载失败：' + e.message); }
  }
  async function sendMsg() {
    var text = input.value.trim();
    if (!text) return;
    input.value = '';
    add('user', text);
    var thinking = document.createElement('div');
    thinking.className = 'to-msg sys';
    thinking.textContent = '思考中…';
    log.appendChild(thinking); log.scrollTop = log.scrollHeight;
    try {
      var data = await api('POST', '/tutor/chat', { question: text, user_id: userId }, 120000);
      thinking.remove();
      add('assistant', data.answer || data.error || '没有回答');
    } catch (e) {
      thinking.remove();
      add('sys', '请求失败：' + e.message);
    }
  }
  close.onclick = function() { el.remove(); _tutorOverlay = null; };
  el.querySelector('#to-send').onclick = sendMsg;
  input.addEventListener('keypress', function(e) { if (e.key === 'Enter') sendMsg(); });

  var head = el.querySelector('.to-head');
  head.addEventListener('mousedown', function(e) {
    if (e.target === close) return;
    var r = el.getBoundingClientRect();
    el.style.left = r.left + 'px'; el.style.top = r.top + 'px';
    el.style.right = 'auto'; el.style.bottom = 'auto';
    var sx = e.clientX, sy = e.clientY;
    function move(ev) {
      el.style.left = Math.max(0, Math.min(window.innerWidth - 80, r.left + ev.clientX - sx)) + 'px';
      el.style.top = Math.max(0, Math.min(window.innerHeight - 40, r.top + ev.clientY - sy)) + 'px';
    }
    function up() { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); }
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
    e.preventDefault();
  });
  load();
}

async function openTutorWindow() {
  if (_tutorFloat && !_tutorFloat.closed) {
    try { _tutorFloat.focus(); } catch (e) {}
    return;
  }
  if (_tutorOverlay) { _tutorOverlay.style.display = 'flex'; return; }
  if (!window.documentPictureInPicture || !window.documentPictureInPicture.requestWindow) {
    openTutorOverlay();
    return;
  }
  var isPopup = false;
  var win = null;
  try {
    win = await window.documentPictureInPicture.requestWindow({ width: 400, height: 620 });
    _tutorFloat = win;
    var doc = win.document;
    doc.open(); doc.write(tutorFloatMarkup(isPopup)); doc.close();
    doc.title = 'AI 导师';
    doc.getElementById('tv-close').onclick = function() { try { win.close(); } catch (e) {} };
    var log = doc.getElementById('tv-log');
    var input = doc.getElementById('tv-input');
    var send = doc.getElementById('tv-send');
    function add(role, text) {
      var el = doc.createElement('div');
      el.className = 'tv-msg ' + role;
      el.textContent = text;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
    }
    async function load() {
      try {
        var r = await fetch('/api/tutor/history?user_id=' + userId);
        var history = await r.json();
        log.innerHTML = '';
        if (!history.length) add('sys', '开始对话吧');
        history.forEach(function(h) { add(h.role === 'user' ? 'user' : 'assistant', h.content); });
      } catch (e) { log.innerHTML = ''; add('sys', '历史加载失败'); }
    }
    async function sendMsg() {
      var text = input.value.trim();
      if (!text) return;
      input.value = '';
      add('user', text);
      var loading = doc.createElement('div'); loading.className = 'tv-msg sys'; loading.textContent = '思考中…'; log.appendChild(loading); log.scrollTop = log.scrollHeight;
      try {
        var r = await fetch('/api/tutor/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({question:text, user_id:userId}) });
        var data = await r.json();
        loading.remove();
        add('assistant', data.answer || data.error || '没有回答');
      } catch (e) { loading.remove(); add('sys', '请求失败'); }
    }
    send.onclick = sendMsg;
    input.addEventListener('keypress', function(e) { if (e.key === 'Enter') sendMsg(); });
    win.addEventListener('pagehide', function() { _tutorFloat = null; });
    load();
  } catch (e) {
    openTutorOverlay();
    showToast('系统置顶浮窗不可用，已切到应用内浮窗', 'info');
  }
}

function ccChar(ch, first) {
  if (ch === ' ') return '<span class="cc-space"></span>';
  var r = Math.random();
  var mode = first ? 'first' : (r < .18 ? 'red' : (r < .30 ? 'black' : 'white'));
  var rot = (Math.random() * 11 - 5.5).toFixed(1);
  var scale = (0.92 + Math.random() * 0.15).toFixed(2);
  return '<span class="cc-char cc-' + mode + '" style="--r:' + rot + 'deg;--s:' + scale + '">' + escapeHtml(ch) + '</span>';
}
function callingCardHTML(lines, kicker, sub) {
  var first = true;
  var body = (lines || []).map(function(line) {
    var chars = String(line).split('').map(function(ch) {
      var out = ccChar(ch, first);
      if (ch !== ' ') first = false;
      return out;
    }).join('');
    return '<div class="cc-line">' + chars + '</div>';
  }).join('');
  return '<div class="calling-card">' +
    '<div class="cc-base">' +
      '<div class="cc-kicker">' + escapeHtml(kicker || 'TAKE YOUR HEART') + '</div>' +
      '<div class="cc-lines">' + body + '</div>' +
      '<div class="cc-sub">' + escapeHtml(sub || 'THE PHANTOM THIEVES') + '</div>' +
      '<img class="cc-logo" src="assets/p5r/logo.png" alt="">' +
    '</div>' +
  '</div>';
}
function mountCallingCard(slot, lines, kicker, sub) {
  if (!slot) return;
  slot.innerHTML = callingCardHTML(lines, kicker, sub);
}

  old.parentNode.replaceChild(fresh, old);
  fresh.classList.add('is-on');
  mountCallingCard(fresh.querySelector('.p5i-card-slot'), ['YOUR MEMORY', 'IS OURS'], 'TAKE YOUR HEART');
  void fresh.offsetWidth;
  try { sessionStorage.setItem('memoryLabIntroSeen', '1'); } catch (e) {}
  _themeIntroTimer = setTimeout(closeP5Intro, ms || 2400);
}
function showThemeIntro(theme) {
  var p3 = document.getElementById('p3-intro');
  var p5 = document.getElementById('p5-intro');
  if (p3) { p3.style.display = 'none'; p3.classList.remove('is-out'); }
  if (p5) { p5.style.display = 'none'; p5.classList.remove('is-on', 'is-out'); }
  if (theme === 'black') showP5Intro(2400, true);
  else showP3Intro(2600, true);
}
function initThemeIntro() {
  var theme = document.documentElement.getAttribute('data-theme') || 'black';
  var seen = false;
  try { seen = sessionStorage.getItem('memoryLabIntroSeen') === '1'; } catch (e) {}
  var p3 = document.getElementById('p3-intro');
  var p5 = document.getElementById('p5-intro');
  if (seen) {
    if (p3) { p3.style.display = 'none'; p3.classList.remove('is-on'); }
    if (p5) { p5.style.display = 'none'; p5.classList.remove('is-on', 'is-out'); }
    return;
  }
  if (theme === 'black') {
    if (p3) p3.style.display = 'none';
    showP5Intro(2400, false);
  } else {
    if (p5) p5.style.display = 'none';
    showP3Intro(2600, false);
  }
}
function replayP3Intro() {
  try { sessionStorage.removeItem('memoryLabIntroSeen'); } catch (e) {}
  showThemeIntro(document.documentElement.getAttribute('data-theme') || 'black');
}
loadPage((location.hash || '#review').slice(1));
initThemeIntro();

window.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && $('#cards-archive') && $('#cards-archive').classList.contains('is-on')) {
    closeCardsArchive();
  }
});
window.addEventListener('beforeunload', function() {
  if (window.Archive3D) { try { window.Archive3D.close(); } catch (e) {} }
  if (typeof teachCleanup === 'function') teachCleanup();
  if (state.tutorialTimer && state.tutorialTimer.running) {
    var timer = state.tutorialTimer;
    navigator.sendBeacon(API + '/documents/' + timer.docId + '/study-time',
      new Blob([JSON.stringify({ user_id:userId, duration_seconds:timer.seconds })], { type:'application/json' }));
  }
});
</script>
